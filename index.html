function renderNav() {
  const listHtml = TABS.map(x => {
    const nm = t(x.ko, x.en, x.tr);
    const act = tab === x.id;
    return `<button onclick="go('${x.id}');closeDrawer();" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 ${act?'bg-rose-600/25 border border-rose-500/50 text-white':'text-slate-300 hover:bg-white/5'}"><span>${x.ic}</span><span class="truncate">${nm}</span></button>`;
  }).join('');
  if (el('pcMenu')) el('pcMenu').innerHTML = listHtml;
  if (el('drwMenu')) el('drwMenu').innerHTML = listHtml;

  const strip = el('topStrip');
  if (strip) {
    strip.innerHTML = TABS.map(x => {
      const nm = t(x.ko, x.en, x.tr).split('·')[0].trim();

    }).join('');
    const ac = el('st_' + tab);
    if (ac && ac.scrollIntoView) ac.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }
}

function toggleDrawer() { el('drawer').classList.toggle('hidden'); }
function closeDrawer() { el('drawer').classList.add('hidden'); }
function go(id) { tab = id; renderNav(); renderPage(); window.scrollTo({ top:0, behavior:'smooth' }); }

function tickClock() {
  const now = new Date();
  const utc = now.toISOString().substring(11,19);
  const kst = new Date(now.getTime() + 9*3600000).toISOString().substring(11,19);
  if (el('utcClock')) el('utcClock').innerText = `UTC ${utc} • KST ${kst}`;

  const tgt = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 10, 0, 0));
  let diffD = (6 - now.getUTCDay() + 7) % 7;
  if (diffD === 0 && now.getUTCHours() >= 10) diffD = 7;
  tgt.setUTCDate(tgt.getUTCDate() + diffD);
  const ms = Math.max(0, tgt - now);
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
  if (el('liveCd')) el('liveCd').innerText = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}
setInterval(tickClock, 1000);

function badgeLv(lv) {

  if (n <= 30) return `<span class="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-mono-code text-[10px] font-bold">TC ${n}</span>`;
  const tg = n - 30;
  return `<span class="px-1.5 py-0.5 rounded ${tg>=4?'bg-amber-500/25 text-amber-300':'bg-purple-500/20 text-purple-300'} font-mono-code text-[10px] font-bold">TG ${tg}</span>`;
}

  }

  if (res.length) {
    el('sMsg').innerHTML = `<span class="text-emerald-400 font-bold">✓ ${t('일치 프로필','Matched','Eşleşen')}: ${res.length}</span>`;

    el('sCards').innerHTML = '';

}

  const fid = prompt(t('플레이어 숫자 ID:','Player ID:','Oyuncu ID:'));

  const nickname = prompt(t('닉네임:','Nickname:','İsim:')) || `Governor_${fid}`;

    ['v0.7.1 ~ v0.7.2','2026-11-28',t('신비한 시련 6대 구역 공식 비율(첨탑·결투장 3부대 + 생명의숲·수정동굴·지식연결점·용암요새) 및 주간 소탕 수정 계산기 복구, KvK 10종 재화 일차별 자동 분배 계산기 탑재','Restored Mystic Trial 6 zones exact ratios & weekly Raid crystal calc + KvK 10-item auto Day 1–5 score splitter','Mistik Sınav 6 bölge oranları, haftalık baskın kristal hesaplayıcı ve KvK 10 kaynak günlük puan dağıtıcı eklendi')],
    ['v0.6.1 ~ v0.6.5','2026-11-27',t('글로벌 범용 비공개 조회 모드(기본 화면 전체 명단·TG 분포 숨김), iOS 사파리 16px 확대 방지, 상단 헤더 2줄 최적화(KO|EN|TR), 메인 2열 타일 그리드','Privacy-first lookup mode (hides roster by default), iOS Safari 16px zoom lock, 2-row header, 2-column grid','Gizlilik öncelikli arama modu, iOS Safari yakınlaştırma kilidi, 2 satırlı başlık ve 2 sütunlu ızgara')],
    ['v0.1.0 ~ v0.6.0','2026-11-24',t('Kingshot Tactical Hub 출범, 다크 크림슨·로즈 네온 UI 대개편, 글로벌 브랜딩(KINGSHOT hub), 전투 리포트 승률 통계, UTC↔KST 변환기, Gen 7 영웅 반영','Launched Kingshot Tactical Hub, Crimson-Rose UI, global KINGSHOT hub branding, Battle Log winrate stats, UTC↔KST converter, Gen 7 heroes','Kingshot Tactical Hub açılışı, Koyu Kızıl arayüz, küresel marka, Savaş Raporu istatistikleri ve Gen 7 kahramanlar')]
  ];
  el('main').innerHTML = `<div class="card rounded-2xl p-4 space-y-2 text-xs"><div class="flex justify-between items-center"><h2 class="font-display font-bold text-base text-white">📋 ${t('전체 개발자 노트 (v0.1.0 ~ v0.7.3)','Full Changelog (v0.1.0 ~ v0.7.3)','Geliştirici Notları (v0.1.0 ~ v0.7.3)')}</h2><span class="px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 font-mono-code font-bold">v0.7.3</span></div>${logs.map(([v,d,b],i)=>`<div class="bg-slate-950 border ${i===0?'border-amber-500/45':'border-slate-800'} rounded-xl p-3"><div class="flex justify-between font-mono-code"><b class="${i===0?'text-amber-300':'text-rose-300'}">${v}</b><span class="text-slate-400">${d}</span></div><p class="text-slate-300 mt-1 leading-relaxed">${b}</p></div>`).join('')}</div>`;
}

const aiLog = [];
function pgAi() {
  el('main').innerHTML = `<div class="card-red rounded-2xl p-4 space-y-3 text-xs"><h2 class="font-display font-bold text-base text-white">🤖 ${t('전술 AI 어시스턴트 (v0.7.3)','Tactical AI Assistant (v0.7.3)','Taktik AI Asistanı (v0.7.3)')}</h2><div id="mobAiLog" class="h-80 overflow-y-auto space-y-2 bg-slate-950 rounded-xl p-3 border border-slate-800"></div><div class="flex gap-2"><input id="mobAiIn" onkeydown="if(event.key==='Enter')askAi('mob')" type="text" placeholder="${t('질문 입력 (예: KvK, 시련, 베어)...','Ask KvK, Trial, Bear...','KvK, Sınav, Ayı sor...')}" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white"><button onclick="askAi('mob')" class="tap px-4 py-2 rounded-xl bg-rose-600 text-white font-bold shrink-0">${t('전송','Send','Gönder')}</button></div></div>`;
  syncAi();
}
function syncAi() {
  const welcome = t(
    'KINGSHOT hub v0.7.3 전술 AI입니다. 신비한 시련 6구역, KvK 1~5일차 점수·관직, 베어 헌트(10:10:80), Gen 7 등 무엇이든 물어보세요!',
    'Welcome to KINGSHOT hub v0.7.3 Tactical AI! Ask about Mystic Trial 6 Zones, KvK Day 1–5, Bear Hunt (10:10:80), or Gen 7.',
    'KINGSHOT hub v0.7.3 Taktik AI Asistanına hoş geldiniz! Mistik Sınav 6 Bölge, KvK 1–5. Gün, Ayı Avı (10:10:80) veya Gen 7 hakkında soru sorabilirsiniz.'
  );
  const list = [{ r:'ai', t:welcome }, ...aiLog];
  const h = list.map(m => `<div class="${m.r==='u'?'text-right':'text-left'}"><span class="inline-block px-3 py-2 rounded-xl ${m.r==='u'?'bg-rose-600 text-white':'bg-slate-900 border border-slate-700 text-slate-200'}">${m.t}</span></div>`).join('');
  if (el('pcAiLog')) { el('pcAiLog').innerHTML = h; el('pcAiLog').scrollTop = el('pcAiLog').scrollHeight; }
  if (el('mobAiLog')) { el('mobAiLog').innerHTML = h; el('mobAiLog').scrollTop = el('mobAiLog').scrollHeight; }
}
function askAi(src) {
  const inp = el(src==='pc'?'pcAiIn':'mobAiIn');
  const q = inp?.value.trim() || '';
  if (!q) return;
  inp.value = '';
  aiLog.push({ r:'u', t:q });
  const s = q.toLowerCase();
  let a = t(
    'KvK 표준 집결은 50:20:30, 수성은 60:20:20, 베어 헌트는 10:10:80(1번 슬롯 공격 버프 영웅 필수)을 권장합니다.',
    'Standard PvP Rally is 50:20:30, Garrison is 60:20:20, and Bear Hunt is 10:10:80 (ATK/Lethality hero in Slot 1).',
    'Standart PvP Ralli 50:20:30, Savunma 60:20:20 ve Ayı Avı 10:10:80 (1. yuvada Saldırı/Ölümcüllük kahramanı zorunlu) önerilir.'
  );
  if (s.includes('시련')||s.includes('mystic')||s.includes('trial')||s.includes('mistik')||s.includes('sınav')) {
    a = t(
      '🏛️ 첨탑(50/15/35 · 50/35/15 · 50/20/30), 결투장(50/10/40 · 40/40/20 · 50/20/30), 생명의숲 50/15/35, 수정동굴 60/20/20, 지식연결점 50/20/30, 용암요새 60/15/25! [출격] 누르지 않고 뒤로가기로 무소모 저장하세요.',
      '🏛️ Spire (50/15/35 · 50/35/15 · 50/20/30), Coliseum (50/10/40 · 40/40/20 · 50/20/30), Forest 50/15/35, Crystal 60/20/20, Nexus 50/20/30, Molten 60/15/25! Press Back without tapping Deploy to save presets free.',
      '🏛️ Kule (50/15/35 · 50/35/15 · 50/20/30), Kolezyum (50/10/40 · 40/40/20 · 50/20/30), Orman 50/15/35, Kristal 60/20/20, Bilgi 50/20/30, Kale 60/15/25! Savaşa basmadan Geri dönerek ücretsiz kaydedin.'
    );
  } else if (s.includes('kvk')||s.includes('점수')||s.includes('관직')||s.includes('score')||s.includes('puan')) {
    a = t(
      '⚔️ Day1 건설(총리대신+토목공정), Day2 룰렛(신흥과학), Day3 펫(고급표식 15,000점), Day4 훈련(참모장+전투동원/미스릴·망치), 토요일 22:00 UTC 구조 요청 시 최대 90% 복구!',
      '⚔️ Day 1 Build (Prime Minister + Civil Eng), Day 2 Roulette (Emerging Science), Day 3 Pets (Adv Marks 15k), Day 4 Train (Chief of Staff + Mobilization), Sat 22:00 UTC Triage recovers up to 90%!',
      '⚔️ 1. Gün İnşaat (Başbakan + Mühendislik), 2. Gün Rulet (Bilim), 3. Gün Pet (Gelişmiş İşaret 15k), 4. Gün Eğitim (Genelkurmay + Seferberlik), Cmt 22:00 UTC Kurtarma ile %90a kadar birlik kurtarılır!'
    );
  } else if (s.includes('곰')||s.includes('베어')||s.includes('bear')||s.includes('ayı')) {
    a = t(
      '🐻 1번 슬롯에 첸코·연우·아마데우스·아마네·마고·비비안만 배치하고 비율 10:10:80을 사용하세요.',
      '🐻 Place ONLY Chenko, Yeonwoo, Amadeus, Amane, Margot, or Vivian in Slot 1 with 10:10:80 ratio.',
      '🐻 1. yuvaya SADECE Chenko, Yeonwoo, Amadeus, Amane, Margot veya Vivian koyun ve 10:10:80 oranını kullanın.'
    );
  }
  aiLog.push({ r:'ai', t:a });
  syncAi();
}

function renderPage() {
  const fn = { home:pgHome, search:pgSearch, kvk:pgKvK, mys:pgMys, rally:pgRally, battle:pgBattle, bear:pgBear, sw:pgSw, tri:pgTri, fac:pgFac, tg:pgTg, hero:pgHero, shop:pgShop, time:pgTime, mac:pgMac, notes:pgNotes, ai:pgAi }[tab];
  if (fn) fn();
}

document.addEventListener('DOMContentLoaded', () => { tickClock(); setLang(lang); });
</script>
