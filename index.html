function formatStove(lv) {
  if (!lv && lv !== 0) return t('미등록', 'Unset', 'Belirsiz');
  if (typeof lv === 'string') return lv;
  return lv <= 30 ? 'TC ' + lv : 'TG ' + (lv - 30);
}

function parseStoveNum(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toUpperCase();
  if (s.startsWith('TG')) return 30 + (parseInt(s.replace('TG', ''), 10) || 1);
  if (s.startsWith('TC')) return parseInt(s.replace('TC', ''), 10) || null;
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}

function timeAgo(iso) {
  if (!iso) return '-';
  const diff = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (diff < 60) return t(`${diff}분 전`, `${diff}m ago`, `${diff}dk önce`);
  const hr = Math.floor(diff / 60);
  if (hr < 24) return t(`${hr}시간 전`, `${hr}h ago`, `${hr}sa önce`);
  return t(`${Math.floor(hr / 24)}일 전`, `${Math.floor(hr / 24)}d ago`, `${Math.floor(hr / 24)}g önce`);
}

async function enqueuePlayerLookup(fid) {
  if (!sb) return;
  try {
    const { data } = await sb.from('lookup_queue').select('id').eq('fid', fid).eq('status', 'pending').limit(1);
    if (!data || data.length === 0) {
      await sb.from('lookup_queue').insert({ fid: fid, status: 'pending' });
    }
  } catch (e) {}
}

async function runHubSearch() {
  const raw = document.getElementById('hubSearchIn').value.trim();
  const area = document.getElementById('searchResultArea');
  if (!raw || !sb) { area.innerHTML = ''; return; }

  area.innerHTML = `<div class="text-zinc-400 py-1">${t('공용 DB 조회 중...', 'Searching Public DB...', 'Veritabanında aranıyor...')}</div>`;

  if (raw.startsWith('#')) {
    const kid = parseInt(raw.slice(1), 10);
    if (!kid) {
      area.innerHTML = `<div class="text-rose-400">${t('올바른 왕국 번호를 입력하세요.', 'Enter a valid Kingdom #.', 'Geçerli bir Krallık # girin.')}</div>`;
      return;
    }
    const [{ data: kList }, { data: pList }] = await Promise.all([
      sb.from('kingdoms').select('*').eq('kid', kid),
      sb.from('players').select('*').eq('kid', kid).order('stove_lv', { ascending: false, nullsFirst: false })
    ]);
    const info = kList && kList[0];
    area.innerHTML = `
      <div class="p-3.5 rounded-2xl bg-zinc-950 border border-purple-500/40 space-y-2">
        <div class="flex justify-between items-center">
          <b class="text-sm text-purple-300">👑 Kingdom #${kid}</b>
          <span class="text-[10px] text-zinc-400">${info ? timeAgo(info.updated_at) : t('전적 미등록', 'No KvK log', 'Kayıt yok')}</span>
        </div>
        <div class="text-zinc-200">${info ? `${t('최근 전적', 'Record', 'Sonuç')}: <b>${info.season_result || '-'}</b> · ${t('전송 그룹', 'Transfer Group', 'Transfer Grubu')}: <b>${info.transfer_group || '-'}</b>` : t('우측 왕국 보드에서 전적을 등록할 수 있습니다.', 'Log record on the right panel.', 'Sağ panelden krallık kaydı ekleyebilirsiniz.')}</div>
        <div class="text-[11px] text-rose-300 font-bold">${t(`소속 플레이어 (${(pList || []).length}명)`, `Players (${(pList || []).length})`, `Oyuncular (${(pList || []).length})`)}</div>
        <div class="space-y-1.5">${(pList || []).map(p => renderPlayerCard(p, false)).join('')}</div>
      </div>`;
    return;
  }

  const isNum = /^\d+$/.test(raw);
  let res;
  if (isNum) {
    res = await sb.from('players').select('*').or(`fid.eq.${raw},kid.eq.${raw}`);
  } else {
    res = await sb.from('players').select('*').ilike('nickname', `%${raw}%`).limit(15);
  }
  const list = res.data || [];

  if (list.length > 0) {
    area.innerHTML = list.map(p => renderPlayerCard(p, true)).join('');
    if (isNum) {
      localStorage.setItem('ks_last_fid', raw);
      lastQuickFid = raw;
      enqueuePlayerLookup(Number(raw));
    }
    return;
  }

  if (isNum) {
    const fid = Number(raw);
    enqueuePlayerLookup(fid);
    area.innerHTML = `
      <div class="p-3.5 rounded-2xl bg-zinc-950 border border-amber-500/40 space-y-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <b class="text-amber-300">⏳ ${t(`ID ${fid} — 자동 조회 대기열 등록됨`, `ID ${fid} — Queued for Auto-Lookup`, `ID ${fid} — Otomatik Sorgu Sırasına Alındı`)}</b>
          <span id="queuePulse_${fid}" class="px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 font-mono-code text-[10px]">${t('워커 응답 대기 중 (6초)...', 'Waiting for worker (6s)...', 'Sunucu yanıtı bekleniyor (6sn)...')}</span>
        </div>
        <p class="text-[11px] text-zinc-300">${t('홈 워커가 가동 중이면 2~3초 내 자동 완성되며, 지금 바로 아래에서 직접 저장할 수도 있습니다.', 'Auto-fills in 2-3s if worker is active, or save manually below:', 'Ev sunucusu açıksa 2-3 sn içinde otomatik dolar veya aşağıdan manuel kaydedebilirsiniz:')}</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input id="qNick_${fid}" placeholder="${t('인게임 닉네임', 'Nickname', 'Oyun İçi İsim')}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-1.5 text-white"/>
          <input id="qKid_${fid}" type="number" placeholder="${t('왕국#', 'Kingdom#', 'Krallık#')}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-1.5 font-mono-code text-white"/>
          <input id="qLv_${fid}" placeholder="${t('등급 (TC30, TG5)', 'Level (TC30, TG5)', 'Seviye (TC30, TG5)')}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-1.5 font-mono-code text-white"/>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <input id="qMemo_${fid}" placeholder="${t('전투력/특이사항 메모 (선택)', 'Power/Notes (opt)', 'Güç / Not (İsteğe bağlı)')}" class="flex-1 min-w-[140px] bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-1.5 text-white"/>
          <button type="button" onclick="quickSavePlayer(${fid})" class="px-4 py-1.5 rounded-xl bg-rose-600 text-white font-bold whitespace-nowrap btn-tap">${t('공용 DB 저장', 'Save', 'Kaydet')}</button>
        </div>
      </div>`;

    let tries = 0;
    const timer = setInterval(async () => {
      tries++;
      const { data: found } = await sb.from('players').select('*').eq('fid', fid);
      if (found && found.length > 0) {
        clearInterval(timer);
        area.innerHTML = found.map(p => renderPlayerCard(p, true)).join('');
        loadLiveLists();
      } else if (tries >= 3) {
        clearInterval(timer);
        const badge = document.getElementById('queuePulse_' + fid);
        if (badge) badge.textContent = t('대기열 저장됨 (수동 등록 가능)', 'Queued (Manual ready)', 'Sıraya alındı (Manuel kayıt hazır)');
      }
    }, 2000);
    return;
  }

  area.innerHTML = `<div class="p-3 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-300">${t(`'${raw}' 검색 결과가 없습니다. 숫자 플레이어 ID를 입력하면 자동 등록이 가능합니다.`, `No results for '${raw}'.`, `'${raw}' için sonuç bulunamadı. Sayısal ID girerek ekleyebilirsiniz.`)}</div>`;
}

function renderPlayerCard(p, editable) {
  const lvTxt = formatStove(p.stove_lv);
  const safeNick = String(p.nickname || ('Governor_' + p.fid)).split('"').join('&quot;');
  const safeMemo = String(p.power_memo || '').split('"').join('&quot;');
  return `
    <div class="p-3.5 rounded-2xl bg-zinc-950 border border-zinc-800 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="px-2 py-1 rounded-xl bg-rose-500/20 border border-rose-500/40 font-mono-code font-bold text-rose-300 whitespace-nowrap shrink-0">${lvTxt}</div>
          <div class="min-w-0">
            <div class="font-bold text-sm text-white truncate">${safeNick} <span class="text-[11px] font-mono-code text-zinc-400">(${p.fid})</span></div>
            <div class="text-[11px] text-zinc-400 truncate">Kingdom #${p.kid || '?'} ${safeMemo ? `· <span class="text-amber-300">${safeMemo}</span>` : ''} · <span class="text-emerald-400">${timeAgo(p.updated_at)}</span></div>
          </div>
        </div>
        <button type="button" onclick="copyText('${p.fid}')" class="px-2.5 py-1 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-200 font-mono-code text-[11px] whitespace-nowrap shrink-0 btn-tap">Copy ID</button>
      </div>
      ${editable ? `
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 pt-2 border-t border-zinc-900">
        <input id="qNick_${p.fid}" value="${safeNick}" placeholder="${t('닉네임', 'Nickname', 'İsim')}" class="bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 text-white"/>
        <input id="qKid_${p.fid}" type="number" value="${p.kid || ''}" placeholder="${t('왕국#', 'King#', 'Krallık#')}" class="bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 font-mono-code text-white"/>
        <input id="qLv_${p.fid}" value="${p.stove_lv ? lvTxt.replace(' ', '') : ''}" placeholder="TC30/TG5" class="bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 font-mono-code text-white"/>
        <div class="flex gap-1">
          <input id="qMemo_${p.fid}" value="${safeMemo}" placeholder="${t('전투력/메모', 'Memo', 'Not')}" class="w-full min-w-0 bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 text-white"/>
          <button type="button" onclick="quickSavePlayer(${p.fid})" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-bold whitespace-nowrap shrink-0 btn-tap">${t('갱신', 'Save', 'Güncelle')}</button>
        </div>
      </div>` : ''}
    </div>`;
}

async function quickSavePlayer(fid) {
  if (!sb) return;
  const nickname = (document.getElementById('qNick_' + fid)?.value || '').trim() || ('Governor_' + fid);
  const kid = parseInt(document.getElementById('qKid_' + fid)?.value, 10) || null;
  const stove_lv = parseStoveNum(document.getElementById('qLv_' + fid)?.value);
  const power_memo = (document.getElementById('qMemo_' + fid)?.value || '').trim() || null;
  const { error } = await sb.from('players').upsert({
    fid, nickname, kid, stove_lv, power_memo, updated_at: new Date().toISOString()
  }, { onConflict: 'fid' });
  if (error) return showToast('Error: ' + error.message);
  showToast(t('공용 DB 저장 완료!', 'Saved to Public DB!', 'Veritabanına kaydedildi!'));
  runHubSearch();
  loadLiveLists();
}

async function registerKingdomDb() {
  if (!sb) return;
  const kid = parseInt(document.getElementById('kRegId').value, 10);
  const season_result = document.getElementById('kRegRes').value.trim();
  const transfer_group = parseInt(document.getElementById('kRegGrp').value, 10) || null;
  if (!kid) return showToast(t('왕국 번호를 입력하세요!', 'Enter Kingdom #!', 'Krallık numarası girin!'));
  const { error } = await sb.from('kingdoms').upsert({
    kid, season_result, transfer_group, updated_at: new Date().toISOString()
  }, { onConflict: 'kid' });
  if (!error) {
    document.getElementById('kRegId').value = '';
    document.getElementById('kRegRes').value = '';
    document.getElementById('kRegGrp').value = '';
    showToast(t('왕국 정보 저장 완료!', 'Kingdom saved!', 'Krallık kaydedildi!'));
    loadLiveLists();
  }
}

async function loadLiveLists() {
  const pBox = document.getElementById('livePlayersBox');
  const kBox = document.getElementById('liveKingdomsBox');
  if (!pBox || !kBox || !sb) return;

  const [{ data: players, count }, { data: kingdoms }] = await Promise.all([
    sb.from('players').select('*', { count: 'exact' }).order('updated_at', { ascending: false }).limit(15),
    sb.from('kingdoms').select('*').order('updated_at', { ascending: false }).limit(10)
  ]);

  const badge = document.getElementById('dbCountBadge');
  const kpiP = document.getElementById('kpiPlayers');
  if (typeof count === 'number') {
    if (badge) badge.textContent = t(`공용 DB ${count}명`, `${count} Players`, `${count} Oyuncu`);
    if (kpiP) kpiP.textContent = t(`${count}명`, `${count}`, `${count}`);
  }

  if (players && players.length > 0) {
    const topP = lastQuickFid ? (players.find(x => String(x.fid) === String(lastQuickFid)) || players[0]) : players[0];
    lastQuickFid = String(topP.fid);
    const labelTxt = `${topP.nickname || 'Governor'} (${formatStove(topP.stove_lv)})`;
    const lbl = document.getElementById('qpLabel');
    if (lbl) lbl.textContent = labelTxt;
    const mRow = document.getElementById('mobileProfileRow');
    const mLbl = document.getElementById('mobileQpLabel');
    if (mRow && mLbl) {
      mRow.classList.remove('hidden');
      mLbl.textContent = `${labelTxt} · #${topP.kid || '?'}`;
    }
  }

  const tgBar = document.getElementById('tgDistBar');
  if (tgBar && players && players.length > 0) {
    const counts = { 'TG5+': 0, 'TG3-4': 0, 'TG1-2': 0, 'TC30-': 0 };
    players.forEach(p => {
      const lv = Number(p.stove_lv) || 0;
      if (lv >= 35) counts['TG5+']++;
      else if (lv >= 33) counts['TG3-4']++;
      else if (lv >= 31) counts['TG1-2']++;
      else counts['TC30-']++;
    });
    const tot = players.length;
    tgBar.classList.remove('hidden');
    tgBar.innerHTML = `
      <div class="flex justify-between text-[10px] text-zinc-400">
        <span>${t('📊 DB 용광로 등급 분포', '📊 DB Stove Distribution', '📊 Ocak Seviye Dağılımı')}</span>
        <span class="font-mono-code text-rose-300">TG5+ (${counts['TG5+']}) · TG3-4 (${counts['TG3-4']}) · TG1-2 (${counts['TG1-2']})</span>
      </div>
      <div class="w-full h-2 rounded-full bg-zinc-900 overflow-hidden flex">
        <div style="width:${(counts['TG5+']/tot)*100}%" class="bg-rose-500"></div>
        <div style="width:${(counts['TG3-4']/tot)*100}%" class="bg-amber-400"></div>
        <div style="width:${(counts['TG1-2']/tot)*100}%" class="bg-emerald-400"></div>
        <div style="width:${(counts['TC30-']/tot)*100}%" class="bg-zinc-600"></div>
      </div>`;
  }

  pBox.innerHTML = (players && players.length) ? players.map(p => `
    <div onclick="document.getElementById('hubSearchIn').value='${p.fid}'; runHubSearch();" class="p-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-900 cursor-pointer border border-zinc-800 flex items-center justify-between gap-2 transition">
      <div class="flex items-center gap-2 min-w-0">
        <span class="px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 font-mono-code font-bold text-[10px] whitespace-nowrap shrink-0">${formatStove(p.stove_lv)}</span>
        <b class="text-white truncate">${p.nickname || ('Governor_' + p.fid)}</b>
        <span class="text-zinc-400 text-[10px] whitespace-nowrap shrink-0">#${p.kid || '?'}</span>
      </div>
      <span class="text-[10px] text-emerald-400 font-mono-code whitespace-nowrap shrink-0">${timeAgo(p.updated_at)}</span>
    </div>`).join('') : `<div class="p-3 rounded-xl bg-zinc-950 text-zinc-400">${t('등록된 플레이어가 없습니다.', 'No tracked players yet.', 'Henüz kayıtlı oyuncu yok.')}</div>`;

  kBox.innerHTML = (kingdoms && kingdoms.length) ? kingdoms.map(x => `
    <div onclick="document.getElementById('hubSearchIn').value='#${x.kid}'; runHubSearch();" class="p-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-900 cursor-pointer border border-zinc-800 flex items-center justify-between gap-2 transition">
      <div class="min-w-0 truncate">
        <b class="text-purple-300">Kingdom #${x.kid}</b>
        <span class="text-[11px] text-zinc-300 ml-1.5">${x.season_result || '-'} ${x.transfer_group ? `(G${x.transfer_group})` : ''}</span>
      </div>
      <span class="text-[10px] text-zinc-400 font-mono-code whitespace-nowrap shrink-0">${timeAgo(x.updated_at)}</span>
    </div>`).join('') : `<div class="p-3 rounded-xl bg-zinc-950 text-zinc-400">${t('등록된 왕국 기록이 없습니다.', 'No kingdom records yet.', 'Henüz krallık kaydı yok.')}</div>`;
}

async function loadGiftCodesDb() {
  const box = document.getElementById('giftCodeBox');
  if (!box || !sb) return;
  const { data } = await sb.from('gift_codes').select('*').order('created_at', { ascending: false }).limit(12);
  if (!data || data.length === 0) {
    box.innerHTML = `<div class="p-3 rounded-xl bg-zinc-950 text-zinc-400 col-span-2">${t('등록된 선물 코드가 없습니다.', 'No gift codes yet.', 'Henüz hediye kodu yok.')}</div>`;
    return;
  }
  box.innerHTML = data.map(c => `
    <div class="p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 flex items-center justify-between gap-2">
      <div class="min-w-0 truncate">
        <span class="font-mono-code font-bold text-amber-300">${c.code}</span>
        ${c.reward ? `<span class="text-[11px] text-zinc-400 ml-2">${c.reward}</span>` : ''}
      </div>
      <button type="button" onclick="copyText('${c.code}')" class="px-2.5 py-1 rounded-lg bg-rose-600/20 border border-rose-500/40 text-rose-300 font-bold text-[10px] whitespace-nowrap shrink-0 btn-tap">Copy</button>
    </div>`).join('');
}

async function addGiftCodeDb() {
  if (!sb) return;
  const code = document.getElementById('newCodeIn').value.trim().toUpperCase();
  const reward = document.getElementById('newCodeNote').value.trim();
  if (!code) return;
  const { error } = await sb.from('gift_codes').upsert({ code, reward, status: 'active' }, { onConflict: 'code' });

function calcBear() {
  const s = parseInt(document.getElementById('bearSec').value, 10) || 10;
  const q = parseInt(document.getElementById('bearQueues').value, 10) || 5;
  const cycle = 300 + s * 2;

  const totalRuns = perQueue * q;
  const stagger = Math.round(cycle / q);
  document.getElementById('bearOut').textContent = t(
    `왕복 주기 ${cycle}초 → 30분간 1부대당 ${perQueue}회 × ${q}부대 = 총 ${totalRuns}회 탑승 (${stagger}초 간격 출격 추천)`,

function addRos(type) {
  const n = document.getElementById(type + 'Name').value.trim();
  const r = document.getElementById(type + 'Role').value;
  if (!n) return;
  if (type === 'sw') { swRos.push({ n, r }); localStorage.setItem('ks_swRos', JSON.stringify(swRos)); renderSw(); }
  else { triRos.push({ n, r }); localStorage.setItem('ks_triRos', JSON.stringify(triRos)); renderTri(); }
}
function delRos(type, i) {
  if (type === 'sw') { swRos.splice(i, 1); localStorage.setItem('ks_swRos', JSON.stringify(swRos)); renderSw(); }
  else { triRos.splice(i, 1); localStorage.setItem('ks_triRos', JSON.stringify(triRos)); renderTri(); }
}
function cpRos(type, mode) {
  const list = type === 'sw' ? swRos : triRos;
  const g = r => list.filter(x => x.r === r).map(x => x.n).join(', ') || '-';
  const ko = type === 'sw'
    ? `[🗡️ 성검전 배정]${NL}🛡️ Tank: ${g('tank')}${NL}⚔️ DPS: ${g('dps')}${NL}💚 Support: ${g('support')}`
    : `[🚩 삼대연맹전 편성]${NL}⚔️ 공격조: ${g('attack')}${NL}🛡️ 수비조: ${g('defender')}${NL}⚡ 기동조: ${g('floater')}`;
  const en = type === 'sw'
    ? `[🗡️ Swordland Roster]${NL}🛡️ Tank: ${g('tank')}${NL}⚔️ DPS: ${g('dps')}${NL}💚 Support: ${g('support')}`
    : `[🚩 Tri-Alliance Squads]${NL}⚔️ Attack: ${g('attack')}${NL}🛡️ Defender: ${g('defender')}${NL}⚡ Floater: ${g('floater')}`;
  const tr = type === 'sw'
    ? `[🗡️ Kılıç Diyarı Kadrosu]${NL}🛡️ Tank: ${g('tank')}${NL}⚔️ DPS: ${g('dps')}${NL}💚 Destek: ${g('support')}`

  copyText(mode === 'ko' ? ko : mode === 'en' ? en : mode === 'tr' ? tr : [ko, en, tr].join(NL + '---' + NL));
}

function calcTg() {
  const b = TG_BUILDINGS[document.getElementById('tgBld').value];
  const f = parseInt(document.getElementById('tgFrom').value, 10);
  const tLv = parseInt(document.getElementById('tgTo').value, 10);
  if (tLv <= f) { document.getElementById('tgOut').innerHTML = `<span class="text-rose-400">${t('목표 등급을 높게 선택하세요.', 'Target must be higher.', 'Hedef seviye daha yüksek olmalıdır.')}</span>`; return; }
  let sumTg = 0, sumTtg = 0;
  for (let i = f; i < tLv; i++) { sumTg += b.tg[i]; sumTtg += b.ttg[i]; }
  document.getElementById('tgOut').innerHTML = `<div class="text-zinc-400">${b[lang]} (TG ${f} → TG ${tLv})</div><div class="text-base font-black text-white mt-0.5">🔥 ${t('순금', 'Truegold', 'Saf Altın')} <span class="text-amber-300 font-mono-code">${sumTg.toLocaleString()}</span> + ✨ ${t('순정금', 'Tempered TG', 'İşlenmiş Altın')} <span class="text-rose-400 font-mono-code">${sumTtg.toLocaleString()}</span></div>`;
}

function calcT10Helios() {
  const branches = parseInt(document.getElementById('t10Branch')?.value, 10) || 1;
  const prog = Math.min(99, Math.max(0, parseFloat(document.getElementById('t10Prog')?.value) || 0));
  const rem = (100 - prog) / 100;
  const dust = Math.round(12600 * branches * rem);
  const tg = Math.round(1850 * branches * rem);
  const out = document.getElementById('t10Out');
  if (!out) return;
  out.innerHTML = t(
    `<div class="font-bold text-white">✨ 남은 필요 재화: 순금 가루 <span class="text-amber-300 font-mono-code">${dust.toLocaleString()}</span>개 + 순금 <span class="text-rose-400 font-mono-code">${tg.toLocaleString()}</span>개</div><div class="text-[11px] text-zinc-400">• 팁: 시련 상점(주간 순금 가루)과 최강왕국 5일차 연구일 + 학자 전초기지(-15%) + 관직 버프 중첩 시 가속을 최대 40% 절약합니다.</div>`,

function calcEw() {
  const f = parseInt(document.getElementById('ewFrom').value, 10);
  const tLv = parseInt(document.getElementById('ewTo').value, 10);
  if (tLv <= f) { document.getElementById('ewOut').textContent = t('목표 강수를 높게 선택하세요.', 'Target must be higher.', 'Hedef seviye daha yüksek olmalıdır.'); return; }
  let sum = 0;
  for (let i = f + 1; i <= tLv; i++) sum += i * 5;
  document.getElementById('ewOut').textContent = t(`Lv.${f} → Lv.${tLv} 필요 전용무기 부속품: 총 ${sum}개`, `Lv.${f} → Lv.${tLv} Exclusive Parts Needed: ${sum}`, `Lv.${f} → Lv.${tLv} Gereken Özel Silah Parçası: ${sum}`);
}

function updateEventCountdown() {
  const txtEl = document.getElementById('nextEventTxt');
  const cdEl = document.getElementById('liveCountdownTxt');
  if (!txtEl || !cdEl) return;
  const now = new Date();
  const target = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 10, 0, 0));
  const day = now.getUTCDay();
  let daysUntilSat = (6 - day + 7) % 7;
  if (daysUntilSat === 0 && now.getUTCHours() >= 10) daysUntilSat = 7;
  target.setUTCDate(target.getUTCDate() + daysUntilSat);
  const diff = Math.max(0, Math.floor((target.getTime() - now.getTime()) / 1000));
  const d = Math.floor(diff / 86400);
  const h = Math.floor((diff % 86400) / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  txtEl.textContent = t(
    '⏱️ 다음 KvK 왕성전 (토 10:00 UTC · 관직예약 금 23:50)',
    '⏱️ Next KvK Castle (Sat 10:00 UTC)',
    '⏱️ Sonraki KvK Kale Savaşı (Cmt 10:00 UTC)'
  );
  cdEl.textContent = `${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
setInterval(updateEventCountdown, 1000);
updateEventCountdown();
