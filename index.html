  const now = new Date();

}

/* ==================== TAB 0: PUBLIC DB & LOOKUP QUEUE ==================== */
function formatStove(lv) {
  if (!lv && lv !== 0) return lang === 'ko' ? '등급 미정' : 'Unset';
  if (typeof lv === 'string') return lv;
  return lv <= 30 ? 'TC ' + lv : 'TG ' + (lv - 30);
}

function parseStoveNum(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toUpperCase();
  if (s.startsWith('TG')) return 30 + (parseInt(s.replace('TG', ''), 10) || 1);
  if (s.startsWith('TC')) return parseInt(s.replace('TC', ''), 10) || null;
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}

function timeAgo(iso) {
  if (!iso) return '-';
  const diff = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (diff < 60) return lang === 'ko' ? `${diff}분 전` : `${diff}m ago`;
  const hr = Math.floor(diff / 60);
  if (hr < 24) return lang === 'ko' ? `${hr}시간 전` : `${hr}h ago`;
  return lang === 'ko' ? `${Math.floor(hr / 24)}일 전` : `${Math.floor(hr / 24)}d ago`;
}

async function enqueuePlayerLookup(fid) {
  if (!sb) return;
  try {
    const { data } = await sb.from('lookup_queue').select('id').eq('fid', fid).eq('status', 'pending').limit(1);
    if (!data || data.length === 0) {
      await sb.from('lookup_queue').insert({ fid: fid, status: 'pending' });
    }
  } catch (e) {}
}

async function runHubSearch() {
  const raw = document.getElementById('hubSearchIn').value.trim();
  const area = document.getElementById('searchResultArea');
  const k = lang === 'ko';
  if (!raw || !sb) { area.innerHTML = ''; return; }

  area.innerHTML = `<div class="text-zinc-400 py-1">${k ? '공용 DB 조회 중...' : 'Searching Public DB...'}</div>`;

  if (raw.startsWith('#')) {
    const kid = parseInt(raw.slice(1), 10);
    if (!kid) {
      area.innerHTML = `<div class="text-rose-400">${k ? '올바른 왕국 번호를 입력하세요. (예: #2107)' : 'Enter a valid Kingdom number (e.g. #2107)'}</div>`;
      return;
    }
    const [{ data: kList }, { data: pList }] = await Promise.all([
      sb.from('kingdoms').select('*').eq('kid', kid),
      sb.from('players').select('*').eq('kid', kid).order('stove_lv', { ascending: false, nullsFirst: false })
    ]);
    const info = kList && kList[0];
    area.innerHTML = `
      <div class="p-4 rounded-2xl bg-zinc-950 border border-purple-500/40 space-y-2.5">
        <div class="flex justify-between items-center">
          <b class="text-base text-purple-300">👑 Kingdom #${kid}</b>
          <span class="text-[11px] text-zinc-400">${info ? timeAgo(info.updated_at) : (k ? '전적 미등록' : 'No KvK log')}</span>
        </div>
        <div class="text-zinc-200">${info ? `${k ? '최근 전적' : 'Record'}: <b>${info.season_result || '-'}</b> · ${k ? '전송 그룹' : 'Transfer Group'}: <b>${info.transfer_group || '-'}</b>` : (k ? '우측 왕국 보드에서 이 서버의 전적을 등록할 수 있습니다.' : 'Log this kingdom record on the right panel.')}</div>
        <div class="text-[11px] text-rose-300 font-bold">${k ? `등록된 소속 플레이어 (${(pList || []).length}명)` : `Registered Players (${(pList || []).length})`}</div>
        <div class="space-y-1.5">${(pList || []).map(p => renderPlayerCard(p, false)).join('')}</div>
      </div>`;
    return;
  }

  const isNum = /^\d+$/.test(raw);
  let res;
  if (isNum) {
    res = await sb.from('players').select('*').or(`fid.eq.${raw},kid.eq.${raw}`);
  } else {
    res = await sb.from('players').select('*').ilike('nickname', `%${raw}%`).limit(15);
  }
  const list = res.data || [];

  if (list.length > 0) {
    area.innerHTML = list.map(p => renderPlayerCard(p, true)).join('');
    if (isNum) enqueuePlayerLookup(Number(raw));
    return;
  }

  if (isNum) {
    const fid = Number(raw);
    enqueuePlayerLookup(fid);
    area.innerHTML = `
      <div class="p-4 rounded-2xl bg-zinc-950 border border-amber-500/40 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <b class="text-amber-300">⏳ ${k ? `ID ${fid} — 자동 조회 대기열 등록됨` : `ID ${fid} — Queued for Auto-Lookup`}</b>
          <span id="queuePulse_${fid}" class="px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 font-mono-code text-[11px]">${k ? '워커 응답 대기 중 (6초)...' : 'Waiting for worker (6s)...'}</span>
        </div>
        <p class="text-[11px] text-zinc-300">
          ${k ? '홈 서버 워커가 켜져 있으면 2~3초 내 자동으로 닉네임·TG 등급이 채워집니다. 지금 바로 아래에서 직접 입력해 저장할 수도 있습니다.' : 'If the home worker is online, player info will appear in 2-3s. Or register manually below:'}
        </p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input id="qNick_${fid}" placeholder="${k ? '인게임 닉네임' : 'Nickname'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-white"/>
          <input id="qKid_${fid}" type="number" placeholder="${k ? '왕국# (예: 2107)' : 'Kingdom#'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 font-mono-code text-white"/>
          <input id="qLv_${fid}" placeholder="${k ? '등급 (예: TC30, TG2)' : 'Level (TC30, TG2)'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 font-mono-code text-white"/>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <a href="https://ks-giftcode.centurygame.com/" target="_blank" rel="noopener" class="text-[11px] text-zinc-400 hover:text-rose-300 underline">${k ? '공식 교환소에서 닉네임·등급 확인 ↗' : 'Check nickname/level on Official Site ↗'}</a>
          <button type="button" onclick="quickSavePlayer(${fid})" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">${k ? '공용 DB에 즉시 저장' : 'Save to Public DB'}</button>
        </div>
      </div>`;

    let tries = 0;
    const timer = setInterval(async () => {
      tries++;
      const { data: found } = await sb.from('players').select('*').eq('fid', fid);
      if (found && found.length > 0) {
        clearInterval(timer);
        area.innerHTML = found.map(p => renderPlayerCard(p, true)).join('');
        loadLiveLists();
      } else if (tries >= 3) {
        clearInterval(timer);
        const badge = document.getElementById('queuePulse_' + fid);

        <div class="text-[10px] text-zinc-400 mt-0.5">${mCnt}부대 총합: ${(cav * mCnt).toLocaleString()}</div>
      </div>
      <div class="p-3.5 rounded-xl bg-zinc-950 border border-rose-500/50">
        <div class="text-rose-400 font-bold">${k ? '🏹 궁병' : '🏹 Archers'} (${ra}%)</div>
        <div class="font-mono-code font-black text-base sm:text-lg text-rose-300 mt-0.5">${arch.toLocaleString()}</div>

function calcBear() {
  const s = parseInt(document.getElementById('bearSec').value, 10) || 10;
  const q = parseInt(document.getElementById('bearQueues').value, 10) || 5;
  const cycle = 300 + s * 2;
  const perQueue = Math.floor(1800 / cycle);
  const totalRuns = perQueue * q;
  const stagger = Math.round(cycle / q);
  document.getElementById('bearOut').textContent = lang === 'ko'
    ? `1부대 왕복 주기: ${cycle}초 (5분 + 왕복 ${s*2}초) → 30분간 1부대당 ${perQueue}회 × ${q}부대 = 총 ${totalRuns}회 탑승! (${stagger}초 간격 순차 출격 추천)`
    : `1-March Cycle: ${cycle}s → ${perQueue} runs/queue × ${q} queues = ${totalRuns} total rallies in 30m (Stagger every ${stagger}s)`;
}

function addRos(type) {
  const n = document.getElementById(type + 'Name').value.trim();
  const r = document.getElementById(type + 'Role').value;
  if (!n) return;
  if (type === 'sw') { swRos.push({ n, r }); localStorage.setItem('ks_swRos', JSON.stringify(swRos)); renderSw(); }
  else { triRos.push({ n, r }); localStorage.setItem('ks_triRos', JSON.stringify(triRos)); renderTri(); }
}
function delRos(type, i) {
  if (type === 'sw') { swRos.splice(i, 1); localStorage.setItem('ks_swRos', JSON.stringify(swRos)); renderSw(); }
  else { triRos.splice(i, 1); localStorage.setItem('ks_triRos', JSON.stringify(triRos)); renderTri(); }
}
function cpRos(type, mode) {
  const list = type === 'sw' ? swRos : triRos;
  const g = r => list.filter(x => x.r === r).map(x => x.n).join(', ') || '-';

function calcEw() {
  const f = parseInt(document.getElementById('ewFrom').value, 10);
  const t = parseInt(document.getElementById('ewTo').value, 10);
  if (t <= f) { document.getElementById('ewOut').textContent = '목표 강수를 높게 선택하세요.'; return; }
  let sum = 0;
  for (let i = f + 1; i <= t; i++) sum += i * 5;
  document.getElementById('ewOut').textContent = `Lv.${f} → Lv.${t} 필요 전용무기 부속품: 총 ${sum}개`;
}

  if (s.includes('베어') || s.includes('bear')) ans = k ? '🐻 참여자 1번 슬롯: 첸코, 연우, 아마데우스, 아마네, 마고, 비비안! 병종 비율 보10:기10:궁80' : '🐻 Slot 1: Chenko, Yeonwoo, Amadeus, Amane, Margot, Vivian. Ratio 10:10:80.';
  else if (s.includes('시련') || s.includes('trial')) ans = k ? '✨ 첨탑: 50/15/35, 50/35/15, 50/20/30 | 결투장: 50/10/40, 40/40/20, 50/20/30' : '✨ Spire: 50/15/35, 50/35/15, 50/20/30 | Coliseum: 50/10/40, 40/40/20, 50/20/30';
  else if (s.includes('순금') || s.includes('truegold')) ans = k ? '🏗️ 8개 건물 Lv.1~8 총합: 순금 31,422개 + 순정금 908개 (슈퍼 정제 16주 주 34회 플랜 최적)' : '🏗️ All 8 buildings Lv.1–8: 31,422 Truegold + 908 Tempered TG (16-wk refine optimal).';
  else if (s.includes('장비') || s.includes('gear') || s.includes('전용무기')) ans = k ? '🛡️ 공격/살상력(장갑·부츠) Lv.20→60→100 먼저 강화, 방어 갑옷류는 Lv.19·59·79 멈춤! 전용무기 10강 총 275개.' : '🛡️ Upgrade Gloves/Boots to 20→60→100 first; stop Armor at Lv.19/59/79. Exclusive Lv.10 = 275 parts.';
  else if (s.includes('상점') || s.includes('shop')) ans = k ? '🛒 경기장(레전드 상자→미스릴), KvK(순금), 시련(주 1회 미스릴), 다이아(룰렛 16만 보석 유지 후 펫 단련석)' : '🛒 Arena(Legend Chest→Mithril), KvK(Truegold), Trial(Weekly Mithril).';
  else if (s.includes('시설') || s.includes('facility')) ans = k ? '🏰 연맹 깃발 75% 이상 덮어야 공격 가능, 15분 연속 점령 시 확정!' : '🏰 Requires >=75% banner coverage & 15m continuous hold.';
  log.innerHTML += `<div class="p-2 rounded-xl bg-zinc-950 border border-zinc-800 whitespace-pre-wrap">${ans}</div>`;
  log.scrollTop = log.scrollHeight;
}

function renderTab() {
  const routes = {
    search: renderSearch, rally: renderRally, bear: renderBear, kvk: renderKvk,
    sw: renderSw, tri: renderTri, fac: renderFac, tg: renderTg,
    hero: renderHero, shop: renderShop, mys: renderMys, mac: renderMac,
    notes: renderNotes, ai: renderAi
  };
  if (routes[curTab]) routes[curTab]();
}

setLang(lang);
</script>
