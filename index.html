  <style>
    :root {
      --bg-base: #070406;
      --crimson: #e11d48;
      --rose: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 8%, rgba(225, 29, 72, 0.16), transparent 34%),
        radial-gradient(circle at 88% 12%, rgba(244, 63, 94, 0.10), transparent 30%),
        linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: #f4f4f5;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .font-display { font-family: 'Syne', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(16, 12, 16, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-crimson {
      background: linear-gradient(150deg, rgba(32, 12, 20, 0.94), rgba(14, 11, 15, 0.96));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 63, 94, 0.36);
    }
    .crimson-glow { box-shadow: 0 0 18px rgba(225, 29, 72, 0.30); }
    .btn-tap { transition: transform 0.1s ease, background-color 0.12s ease, border-color 0.15s ease; }
    .btn-tap:active { transform: scale(0.96); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tile-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(155deg, rgba(22, 16, 22, 0.95), rgba(12, 10, 14, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.14s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .tile-card:hover {
      border-color: rgba(244, 63, 94, 0.45);
      box-shadow: 0 8px 24px rgba(225, 29, 72, 0.16);
    }
    .tile-card::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: -18px;
      width: 64px;
      height: 64px;
      border-radius: 9999px;
      background: radial-gradient(circle, var(--tile-glow, rgba(244, 63, 94, 0.22)), transparent 70%);
      pointer-events: none;
    }
  </style>
</head>

function showToast(msg) {
  const b = document.getElementById('toastBox');
  if (!b) return;
  b.textContent = msg;
  b.classList.remove('hidden');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => b.classList.add('hidden'), 2000);
}

function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(String(txt));
  }
  showToast(lang === 'ko' ? '복사되었습니다!' : (lang === 'tr' ? 'Kopyalandı!' : 'Copied!'));
}

function toggleDrawer(open) {
  const d = document.getElementById('toolDrawer');
  if (!d) return;
  if (open) d.classList.remove('hidden');
  else d.classList.add('hidden');
}

function jumpToGift() {
  switchTab('search');
  setTimeout(() => document.getElementById('giftSection')?.scrollIntoView({ behavior: 'smooth' }), 60);
}

function setLang(l) {
  lang = l;

  ['ko', 'en', 'tr'].forEach(code => {
    const btn = document.getElementById('btnL_' + code);
    if (btn) btn.className = code === l

  document.getElementById('dkLbl_rally').textContent = l === 'ko' ? '병력·계산' : (l === 'tr' ? 'Birlikler' : 'Troops');

function renderNavs() {
  const items = TABS[lang] || TABS.ko;
  const bar = document.getElementById('tabBar');
  if (bar) {
    bar.innerHTML = items.map(([id, label]) => {
      const act = curTab === id;
      return `<button type="button" id="tabBtn_${id}" onclick="switchTab('${id}')" class="px-2.5 py-1 rounded-lg whitespace-nowrap font-bold shrink-0 btn-tap ${act ? 'bg-gradient-to-r from-rose-500 to-red-600 text-white crimson-glow' : 'bg-zinc-900/90 text-zinc-300 border border-zinc-800/90'}">${label}</button>`;
    }).join('');
    requestAnimationFrame(() => {
      const activeEl = document.getElementById('tabBtn_' + curTab);
      if (activeEl && bar) {
        const leftPos = activeEl.offsetLeft - (bar.clientWidth / 2) + (activeEl.clientWidth / 2);
        bar.scrollTo({ left: Math.max(0, leftPos), behavior: 'smooth' });
      }
    });
  }
  const left = document.getElementById('pcLeftNav');
  if (left) {
    left.innerHTML = `<div class="glass rounded-2xl p-2 space-y-1 sticky top-28 text-xs">${items.map(([id, label]) => {
      const act = curTab === id;
      return `<button type="button" onclick="switchTab('${id}')" class="w-full text-left px-2.5 py-2 rounded-xl font-bold transition ${act ? 'bg-rose-600 text-white crimson-glow' : 'text-zinc-300 hover:bg-zinc-900'}">${label}</button>`;
    }).join('')}</div>`;
  }
  const drawer = document.getElementById('drawerMenuList');
  if (drawer) {
    drawer.innerHTML = items.map(([id, label]) => {
      const act = curTab === id;
      return `<button type="button" onclick="switchTab('${id}');toggleDrawer(false)" class="w-full text-left px-3 py-2 rounded-xl font-bold ${act ? 'bg-rose-600 text-white' : 'bg-zinc-900/90 text-zinc-200 border border-zinc-800'}">${label}</button>`;
    }).join('');
  }
  ['home', 'search', 'rally', 'ai'].forEach(id => {
    const el = document.getElementById('dock_' + id);
    if (el) el.className = `py-1 rounded-xl flex flex-col items-center gap-0.5 btn-tap ${curTab === id ? 'text-rose-400 font-bold bg-rose-500/10' : 'text-zinc-400'}`;
  });
}

function switchTab(id) {
  if (activePollTimer) { clearInterval(activePollTimer); activePollTimer = null; }
  curTab = id;
  renderNavs();
  renderTab();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function formatStove(lv) {
  if (!lv && lv !== 0) return lang === 'ko' ? '등급 미정' : (lang === 'tr' ? 'Belirsiz' : 'Unset');
  if (typeof lv === 'string') return lv;
  return lv <= 30 ? 'TC ' + lv : 'TG ' + (lv - 30);
}

function parseStoveNum(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toUpperCase();
  if (s.startsWith('TG')) return 30 + (parseInt(s.replace('TG', ''), 10) || 1);
  if (s.startsWith('TC')) return parseInt(s.replace('TC', ''), 10) || null;
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}

function timeAgo(iso) {
  if (!iso) return '-';
  const diff = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (diff < 60) return lang === 'ko' ? `${diff}분 전` : `${diff}m ago`;
  const hr = Math.floor(diff / 60);
  if (hr < 24) return lang === 'ko' ? `${hr}시간 전` : `${hr}h ago`;
  return lang === 'ko' ? `${Math.floor(hr / 24)}일 전` : `${Math.floor(hr / 24)}d ago`;
}

async function enqueuePlayerLookup(fid) {
  if (!sb) return;
  try {
    const { data } = await sb.from('lookup_queue').select('id').eq('fid', fid).eq('status', 'pending').limit(1);
    if (!data || data.length === 0) {
      await sb.from('lookup_queue').insert({ fid: fid, status: 'pending' });
    }
  } catch (e) {}
}

function buildTgDistributionHtml(players) {
  const k = lang === 'ko';
  if (!players || !players.length) return '';
  const counts = {};
  players.forEach(p => {
    const lbl = p.stove_lv ? formatStove(p.stove_lv) : (k ? '미정' : 'Unset');
    counts[lbl] = (counts[lbl] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a, b) => {
    const score = s => s.startsWith('TG') ? 100 + (parseInt(s.slice(2), 10) || 0) : s.startsWith('TC') ? (parseInt(s.slice(2), 10) || 0) : 0;
    return score(b[0]) - score(a[0]);
  });
  const total = players.length;
  return `
    <div class="p-3 rounded-xl bg-black/50 border border-rose-500/30 space-y-2">
      <div class="flex items-center justify-between text-[11px]">
        <span class="font-bold text-rose-300">📊 ${k ? `검색된 왕국 도시센터(TC/TG) 분포 (총 ${total}명)` : (lang === 'tr' ? `Krallık TC/TG Dağılımı (${total} oyuncu)` : `Searched Kingdom TC/TG Distribution (${total} players)`)}</span>
      </div>
      <div class="space-y-1.5">
        ${sorted.map(([lbl, cnt]) => {
          const pct = Math.round((cnt / total) * 100);
          return `
            <div class="flex items-center gap-2 text-[11px]">
              <span class="w-12 font-mono-code font-bold ${lbl.startsWith('TG') ? 'text-rose-400' : 'text-amber-300'}">${lbl}</span>
              <div class="flex-1 h-2 rounded-full bg-zinc-900 overflow-hidden">
                <div class="h-full rounded-full ${lbl.startsWith('TG') ? 'bg-gradient-to-r from-rose-500 to-red-600' : 'bg-amber-400'}" style="width:${pct}%"></div>
              </div>
              <span class="w-16 text-right font-mono-code text-zinc-300">${cnt}${k ? '명' : 'p'} (${pct}%)</span>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

async function runHubSearch() {
  if (activePollTimer) { clearInterval(activePollTimer); activePollTimer = null; }
  const raw = document.getElementById('hubSearchIn').value.trim();
  const area = document.getElementById('searchResultArea');
  const clearBtn = document.getElementById('clearSearchBtn');
  const k = lang === 'ko';
  if (!raw || !sb) { clearSearchResults(false); return; }

  area.classList.remove('hidden');
  if (clearBtn) clearBtn.classList.remove('hidden');
  area.innerHTML = `<div class="text-zinc-400 py-1">${k ? '공용 DB 조회 중...' : 'Searching DB...'}</div>`;

  // 1) #왕국번호 검색
  if (raw.startsWith('#')) {
    const kid = parseInt(raw.slice(1), 10);
    if (!kid) {
      area.innerHTML = `<div class="text-rose-400">${k ? '올바른 왕국 번호를 입력하세요.' : 'Enter a valid Kingdom #.'}</div>`;
      return;
    }
    const [{ data: kList }, { data: pList }] = await Promise.all([
      sb.from('kingdoms').select('*').eq('kid', kid),
      sb.from('players').select('*').eq('kid', kid).order('stove_lv', { ascending: false, nullsFirst: false })
    ]);
    const info = kList && kList[0];
    const tgHtml = buildTgDistributionHtml(pList || []);
    area.innerHTML = `
      <div class="p-3 rounded-2xl bg-zinc-950 border border-purple-500/40 space-y-2.5">
        <div class="flex justify-between items-center">
          <b class="text-sm text-purple-300">👑 Kingdom #${kid}</b>
          <span class="text-[10px] text-zinc-400">${info ? timeAgo(info.updated_at) : (k ? '전적 미등록' : 'No KvK log')}</span>
        </div>
        <div class="text-zinc-200">${info ? `${k ? '최근 전적' : 'Record'}: <b>${info.season_result || '-'}</b> · ${k ? '전송 그룹' : 'Transfer Group'}: <b>${info.transfer_group || '-'}</b>` : (k ? '아래 왕국 보드에서 전적을 등록할 수 있습니다.' : 'Log record in the Kingdom board below.')}</div>
        <div class="text-[11px] text-rose-300 font-bold">${k ? `조회된 소속 플레이어 (${(pList || []).length}명)` : `Matched Players (${(pList || []).length})`}</div>
        ${tgHtml}
        <div class="space-y-1.5">${(pList || []).map(p => renderPlayerCard(p, false)).join('')}</div>
      </div>`;
    return;
  }

  // 2) 플레이어 ID 또는 닉네임 검색
  const isNum = /^\d+$/.test(raw);
  let res;
  if (isNum) {
    res = await sb.from('players').select('*').eq('fid', Number(raw));
  } else {
    res = await sb.from('players').select('*').ilike('nickname', `%${raw}%`).limit(15);
  }
  const list = res.data || [];

  if (list.length > 0) {
    area.innerHTML = list.map(p => renderPlayerCard(p, true)).join('');
    if (isNum) enqueuePlayerLookup(Number(raw));
    return;
  }

  if (isNum) {
    const fid = Number(raw);
    enqueuePlayerLookup(fid);
    area.innerHTML = `
      <div class="p-3 rounded-2xl bg-zinc-950 border border-amber-500/40 space-y-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <b class="text-amber-300">⏳ ${k ? `ID ${fid} — 자동 조회 대기열 등록됨` : `ID ${fid} — Queued`}</b>
          <span id="queuePulse_${fid}" class="px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 font-mono-code text-[10px]">${k ? '워커 응답 대기 중...' : 'Waiting...'}</span>
        </div>
        <p class="text-[11px] text-zinc-300">${k ? '워커가 가동 중이면 자동 완성되며, 아래에서 직접 저장할 수도 있습니다.' : 'Auto-fills if worker is active, or save manually below:'}</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5">
          <input id="qNick_${fid}" placeholder="${k ? '인게임 닉네임' : 'Nickname'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-2.5 py-1.5 text-base sm:text-xs text-white"/>
          <input id="qKid_${fid}" type="number" placeholder="${k ? '왕국#' : 'Kingdom#'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-2.5 py-1.5 font-mono-code text-base sm:text-xs text-white"/>
          <input id="qLv_${fid}" placeholder="${k ? '등급 (TC30, TG5)' : 'Level (TC30, TG5)'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-2.5 py-1.5 font-mono-code text-base sm:text-xs text-white"/>
        </div>
        <div class="flex items-center gap-1.5">
          <input id="qMemo_${fid}" placeholder="${k ? '전투력/특이사항 메모 (선택)' : 'Power/Notes (opt)'}" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-2.5 py-1.5 text-base sm:text-xs text-white min-w-0"/>
          <button type="button" onclick="quickSavePlayer(${fid})" class="px-4 py-1.5 rounded-xl bg-rose-600 text-white font-bold shrink-0 btn-tap">${k ? '저장' : 'Save'}</button>
        </div>
      </div>`;

    let tries = 0;
    activePollTimer = setInterval(async () => {
      tries++;
      const { data: found } = await sb.from('players').select('*').eq('fid', fid);
      if (found && found.length > 0) {
        clearInterval(activePollTimer);
        activePollTimer = null;
        area.innerHTML = found.map(p => renderPlayerCard(p, true)).join('');
      } else if (tries >= 3) {
        clearInterval(activePollTimer);
        activePollTimer = null;
        const badge = document.getElementById('queuePulse_' + fid);
        if (badge) badge.textContent = k ? '대기열 저장됨 (수동 등록 가능)' : 'Queued (Manual ready)';
      }
    }, 2000);
    return;
  }

  area.innerHTML = `<div class="p-3 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-300">${k ? `'${raw}' 검색 결과가 없습니다. 숫자 플레이어 ID를 입력하면 자동 등록이 가능합니다.` : `No results for '${raw}'.`}</div>`;
}

async function quickSavePlayer(fid) {
  if (!sb) return;
  const nickname = (document.getElementById('qNick_' + fid)?.value || '').trim() || ('Governor_' + fid);
  const kid = parseInt(document.getElementById('qKid_' + fid)?.value, 10) || null;
  const stove_lv = parseStoveNum(document.getElementById('qLv_' + fid)?.value);
  const power_memo = (document.getElementById('qMemo_' + fid)?.value || '').trim() || null;
  const { error } = await sb.from('players').upsert({
    fid, nickname, kid, stove_lv, power_memo, updated_at: new Date().toISOString()
  }, { onConflict: 'fid' });
  if (error) {
    showToast('Error: ' + error.message);
    return;
  }
  showToast(lang === 'ko' ? '저장 완료!' : 'Saved!');
  runHubSearch();

async function loadKingdomBoardOnly(forceRefresh) {

function calcBear() {
  const s = parseInt(document.getElementById('bearSec').value, 10) || 10;

  const stagger = Math.round(cycle / q);
  document.getElementById('bearOut').textContent = lang === 'ko'
    ? `왕복 주기 ${cycle}초 → 30분간 1부대당 ${perQueue}회 × ${q}부대 = 총 ${totalRuns}회 탑승 (${stagger}초 간격 출격 추천)`

function addRos(type) {
  const n = document.getElementById(type + 'Name').value.trim();

function delRos(type, i) {

async function askAi(preset, pfx) {
  const inp = document.getElementById(pfx + 'aiIn'), q = (preset || inp.value).trim();
  if (!q) return;
  inp.value = '';
  const log = document.getElementById(pfx + 'aiLog'), k = lang === 'ko';
  log.innerHTML += `<div class="flex justify-end"><div class="p-2 rounded-xl bg-rose-600 text-white font-bold">${q}</div></div>`;
  const s = q.toLowerCase();
  let ans = k ? '베어, 시련, 순금, 장비, 상점, 시설 키워드로 질문해 주세요!' : 'Ask about Bear, Trial, Truegold, Gear, Shops, or Facilities!';
  if (s.includes('베어') || s.includes('bear')) ans = k ? '🐻 참여자 1번 슬롯: 첸코, 연우, 아마데우스, 아마네, 마고, 비비안! 병종 비율 보10:기10:궁80' : '🐻 Slot 1: Chenko, Yeonwoo, Amadeus, Amane, Margot, Vivian. Ratio 10:10:80.';
  else if (s.includes('시련') || s.includes('trial')) ans = k ? '✨ 첨탑: 50/15/35, 50/35/15, 50/20/30 | 결투장: 50/10/40, 40/40/20, 50/20/30' : '✨ Spire: 50/15/35, 50/35/15, 50/20/30 | Coliseum: 50/10/40, 40/40/20, 50/20/30';
  else if (s.includes('순금') || s.includes('truegold')) ans = k ? '🏗️ 8개 건물 Lv.1~8 총합: 순금 31,422개 + 순정금 908개 (슈퍼 정제 16주 주 34회 플랜 최적)' : '🏗️ All 8 buildings Lv.1–8: 31,422 Truegold + 908 Tempered TG (16-wk refine optimal).';
  else if (s.includes('장비') || s.includes('gear') || s.includes('전용무기')) ans = k ? '🛡️ 공격/살상력(장갑·부츠) Lv.20→60→100 먼저 강화, 방어 갑옷류는 Lv.19·59·79 멈춤! 전용무기 10강 총 275개.' : '🛡️ Upgrade Gloves/Boots to 20→60→100 first; stop Armor at Lv.19/59/79. Exclusive Lv.10 = 275 parts.';
  else if (s.includes('상점') || s.includes('shop')) ans = k ? '🛒 경기장(레전드 상자→미스릴), KvK(순금), 시련(주 1회 미스릴), 다이아(룰렛 16만 보석 유지 후 펫 단련석)' : '🛒 Arena(Legend Chest→Mithril), KvK(Truegold), Trial(Weekly Mithril).';
  else if (s.includes('시설') || s.includes('facility')) ans = k ? '🏰 연맹 깃발 75% 이상 덮어야 공격 가능, 15분 연속 점령 시 확정!' : '🏰 Requires >=75% banner coverage & 15m continuous hold.';
  log.innerHTML += `<div class="p-2 rounded-xl bg-zinc-950 border border-zinc-800 whitespace-pre-wrap">${ans}</div>`;
  log.scrollTop = log.scrollHeight;
}
