function updateClock(){
  const d = new Date();
  const s = [d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  const remSec = 86400 - (d.getUTCHours()*3600 + d.getUTCMinutes()*60 + d.getUTCSeconds());
  const rsFull = [Math.floor(remSec/3600), Math.floor((remSec%3600)/60), remSec%60].map(n=>String(n).padStart(2,'0')).join(':');
  const p=document.getElementById('utcDesktop'), rp=document.getElementById('rstDesktop');
  if(p) p.textContent=s; if(rp) rp.textContent=rsFull;
  const bUtc=document.getElementById('bannerUtc'), bRst=document.getElementById('bannerRst');
  if(bUtc) bUtc.textContent=s; if(bRst) bRst.textContent=rsFull;
}
setInterval(updateClock,1000); updateClock();

function showToast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),2000);
}
function copyText(txt){
  navigator.clipboard.writeText(txt).then(()=>showToast(lang==='ko'?'복사 완료!':'Copied!'));

const SB_URL = "https://soyodukrsykhgsufwtth.supabase.co";
const SB_KEY = "sb_publishable_mHkDQ668sCfxQSJO61qAGA_vkbw_I94";

function formatStove(lv){
  if(!lv) return 'TC ?';
  return lv <= 30 ? 'TC ' + lv : 'TG ' + (lv - 30);
}

function stoveBadgeClass(lv){
  if(!lv) return 'bg-zinc-900 border-zinc-700 text-zinc-400';
  if(lv <= 30) return 'bg-zinc-800 border-zinc-600 text-zinc-200';
  if(lv <= 33) return 'bg-rose-500/20 border-rose-500/45 text-rose-300';
  return 'bg-gradient-to-r from-rose-600 to-red-700 border-rose-300/60 text-white shadow-sm';
}

function timeAgo(iso){
  if(!iso) return '-';
  const diff = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if(diff < 60) return lang==='ko' ? diff + '분 전' : diff + 'm ago';
  const hr = Math.floor(diff / 60);
  if(hr < 24) return lang==='ko' ? hr + '시간 전' : hr + 'h ago';
  return lang==='ko' ? Math.floor(hr/24) + '일 전' : Math.floor(hr/24) + 'd ago';
}

async function sbFetch(path, opt){
  opt = opt || {};
  return fetch(SB_URL + '/rest/v1/' + path, {
    method: opt.method || 'GET',
    body: opt.body,
    headers: Object.assign({
      apikey: SB_KEY,
      Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    }, opt.headers || {})
  });
}

function updateNext10Utc(){
  const el = document.getElementById('statNext10Utc');
  if(!el) return;
  const d = new Date();
  const nowSec = d.getUTCHours()*3600 + d.getUTCMinutes()*60 + d.getUTCSeconds();
  const target = 10 * 3600;
  const diff = nowSec < target ? (target - nowSec) : (86400 - nowSec + target);
  el.textContent = [Math.floor(diff/3600), Math.floor((diff%3600)/60)].map(n=>String(n).padStart(2,'0')).join('h ') + 'm';
}

async function deletePlayerDb(fid){
  const k = lang==='ko';
  if(!confirm(k ? `플레이어 ID (${fid})를 DB에서 삭제할까요?` : `Delete Player ID (${fid}) from DB?`)) return;
  const res = await sbFetch('players?fid=eq.' + fid, { method: 'DELETE' });
  if(res.ok){
    document.getElementById('searchResultArea').innerHTML = '';
    showToast(k ? '삭제 완료!' : 'Deleted!');
    loadLiveLists();
  }
}

async function updatePlayerInline(fid){
  const nick = document.getElementById('edNick_' + fid).value.trim();
  const kid = parseInt(document.getElementById('edKid_' + fid).value) || null;
  const st = document.getElementById('edStove_' + fid).value;
  const memo = document.getElementById('edMemo_' + fid)?.value.trim();
  const stove_lv = st ? parseInt(st) : null;
  const payload = { fid: fid, updated_at: new Date().toISOString() };
  if(nick) payload.nickname = nick;
  if(kid) payload.kid = kid;
  if(stove_lv) payload.stove_lv = stove_lv;
  if(memo !== undefined) payload.power_memo = memo;
  const res = await sbFetch('players', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify(payload)
  });
  if(res.ok){
    showToast(lang==='ko'?'프로필 저장 완료!':'Profile updated!');
    loadLiveLists();
  }
}

async function runHubSearch(){
  const raw = document.getElementById('hubSearchIn').value.trim();
  const area = document.getElementById('searchResultArea');
  const badge = document.getElementById('proxyStatusBadge');
  const k = lang==='ko';
  if(!raw){ area.innerHTML=''; return; }

  if(raw.startsWith('#')){
    const kid = parseInt(raw.slice(1));
    const [kRes, pRes] = await Promise.all([
      sbFetch('kingdoms?kid=eq.' + kid),
      sbFetch('players?kid=eq.' + kid + '&order=stove_lv.desc.nullslast')
    ]);
    const kData = await kRes.json(), pData = await pRes.json();
    const info = kData[0];
    area.innerHTML = `
      <div class="glass rounded-2xl p-4 border-rose-500/40 space-y-2">
        <div class="flex justify-between items-center">
          <b class="text-base text-rose-300">👑 Kingdom #${kid}</b>
          <span class="text-[11px] text-zinc-400">${info ? timeAgo(info.updated_at) : (k?'미등록 왕국':'Unregistered')}</span>
        </div>
        <div class="text-zinc-200">${info ? (k?'최근 전적':'Result') + ': <b>' + (info.season_result||'-') + '</b> · ' + (k?'전송 그룹':'Transfer Group') + ': <b>' + (info.transfer_group||'-') + '</b>' : (k?'아래 왕국 기록 칸에서 KvK 전적을 기록할 수 있습니다.':'Log KvK record below.')}</div>
        <div class="text-[11px] text-rose-300">${k?'등록된 소속 플레이어: ' + pData.length + '명':'Tracked Players in #' + kid + ': ' + pData.length}</div>
      </div>`;
    return;
  }

  const isNum = /^\d+$/.test(raw);
  const query = isNum ? ('players?fid=eq.' + raw) : ('players?nickname=ilike.*' + encodeURIComponent(raw) + '*');
  const res = await sbFetch(query);
  const list = await res.json();

  if(isNum){
    const fid = parseInt(raw);
    area.innerHTML = `<div class="glass rounded-2xl p-3.5 border-rose-500/40 text-rose-300 font-mono-code">⏳ ${k?'프록시 서버 통해 인게임 프로필 조회 중...':'Fetching live profile via API proxy...'}</div>`;
    let fetched = null;
    try {
      const pRes = await fetch('/.netlify/functions/ks-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'player', fid: String(fid) })
      });
      if (pRes.ok) {
        const pJson = await pRes.json();
        if (pJson?.ok && pJson?.data?.data) {
          fetched = pJson.data.data;
          if(badge){ badge.textContent = '🟢 API Live Sync'; badge.className = 'px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-mono-code text-[10px]'; }
        } else {
          if(badge){ badge.textContent = '🔴 Manual Edit Mode'; badge.className = 'px-2.5 py-1 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 font-mono-code text-[10px]'; }
        }
      }
    } catch (e) {}

    const existing = (list && list[0]) ? list[0] : {};
    const merged = {
      fid: fid,
      nickname: fetched?.nickname || existing.nickname || ('Governor_' + fid),
      kid: fetched?.kid || existing.kid || null,
      stove_lv: fetched?.stove_lv || existing.stove_lv || null,
      power_memo: existing.power_memo || null,
      avatar_image: fetched?.avatar_image || existing.avatar_image || null,
      updated_at: new Date().toISOString()
    };
    await sbFetch('players', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify(merged)
    });
    const note = fetched ? (k?'🟢 실시간 API 동기화됨':'🟢 Live API Synced') : (k?'🔴 수동 편집 모드 (아래에서 닉네임·등급 저장)':'🔴 Manual Edit Mode');
    area.innerHTML = renderEditablePlayerCard(merged, note);
    loadLiveLists();
    return;
  }

  if(!list || list.length===0){
    area.innerHTML = `<div class="glass rounded-2xl p-4 border-rose-500/40">${k?"'" + raw + "' 검색 결과가 없습니다. 숫자 플레이어 ID를 입력하면 즉시 등록됩니다!":"No match for '" + raw + "'. Enter numeric Player ID to register!"}</div>`;
    return;
  }
  area.innerHTML = list.map(p=>renderEditablePlayerCard(p, '')).join('');
}

  const pRes = await sbFetch('players?select=fid,nickname');
  const players = await pRes.json();
  if(!players || !players.length){
    logBox.innerHTML = `<div class="text-rose-400">${k?'등록된 플레이어가 없습니다.':'No registered players found.'}</div>`;
    return;
  }

  logBox.innerHTML = `<div class="text-zinc-200">🚀 [${cdk}] ${k?`총 ${players.length}명 대상 순차 발송 시작...`:`Starting batch redeem for ${players.length} players...`}</div>`;

  for(const p of players){
    const label = `${p.nickname || 'Governor'} (${p.fid})`;
    try{
      const r2 = await fetch('/.netlify/functions/ks-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'redeem', fid: String(p.fid), cdk: cdk })
      });
      const pJson = await r2.json();
      if(pJson?.ok && pJson?.data){
        const j2 = pJson.data;
        const ok = j2?.code === 0 || j2?.err_code === 20000;
        const msg = j2?.msg || (ok ? 'SUCCESS' : 'CODE_' + (j2?.err_code || j2?.code));
        logBox.innerHTML += `<div class="${ok?'text-emerald-400':'text-rose-300'}">${ok?'✅':'⚠️'} ${label} → ${msg}</div>`;
      } else {
        logBox.innerHTML += `<div class="text-rose-400">⚠️ ${label} → ${pJson?.error || 'Upstream WAF Blocked'}</div>`;
      }
    }catch(err){
      logBox.innerHTML += `<div class="text-rose-400">⚠️ ${label} → Proxy Error</div>`;
    }
    logBox.scrollTop = logBox.scrollHeight;
    await new Promise(r=>setTimeout(r, 900));
  }
  logBox.innerHTML += `<div class="text-emerald-400 font-bold">✔ ${k?'일괄 발송 작업 완료!':'Batch redeem finished!'}</div>`;
}

function calcKvkRally(){
  const pts=document.getElementById('eHit').value.trim().split(':').map(Number);
  const out=document.getElementById('rOut'), k=lang==='ko';
  if(pts.length!==3||pts.some(isNaN)){out.innerHTML=`<div class="text-xs text-rose-400">HH:MM:SS</div>`;return;}
  const hit=pts[0]*3600+pts[1]*60+pts[2], prep=parseInt(document.getElementById('rPrep').value)||300;
  const fmt=s=>{s=((s%86400)+86400)%86400;return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');};
  out.innerHTML=[1,2,3].map(i=>{
    const m=parseInt(document.getElementById('m'+i).value)||0, imp=hit+i, op=imp-m-prep;
    return `<div class="p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 flex justify-between items-center text-xs"><div><b class="text-rose-400">${k?`B팀 ${i}집결 (+${i}s)`:`Team B Rally #${i} (+${i}s)`}</b><div class="text-[11px] text-zinc-400">${k?'도착':'Hit'}: ${fmt(imp)}</div></div><div class="text-right"><div class="text-[10px] text-zinc-400">${k?'개시(UTC)':'Open'}</div><b class="font-mono-code text-sm text-white">${fmt(op)}</b></div></div>`;
  }).join('');
}

        <ul class="space-y-1 text-zinc-300">${(k?l.ko:l.en).map(item=>`<li>• ${item}</li>`).join('')}</ul>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ==================== TAB 12 & PC DOCK: TACTICAL AI ==================== */
function getAiHtml(isDock){
  const k=lang==='ko';
  const chips = k ? ['베어 조이너 누구 써?','결투장·첨탑 비율','순금 8강 총 몇 개?','신화 장비 강화 순서','시설 점령 조건'] : ['Best Bear joiners?','Coliseum & Spire ratios?','Total Truegold Lv8?','Mythic gear order?','Facility rules?'];
  const pfx = isDock ? 'd_' : 'm_';
  return `
  <div class="${isDock?'h-full flex flex-col':'max-w-2xl mx-auto glass rounded-2xl overflow-hidden border border-rose-500/40'} text-xs">
    <div class="p-3.5 bg-zinc-950 border-b border-zinc-800 flex justify-between items-center">
      <b class="text-sm text-white">${k?'🤖 전술 AI 어시스턴트':'🤖 Tactical AI Assistant'}</b>
      <button type="button" onclick="document.getElementById('${pfx}keyBox').classList.toggle('hidden')" class="px-2 py-1 rounded bg-zinc-900 border border-zinc-700 text-rose-400 font-bold text-[10px]">🔑 API Key</button>
    </div>
    <div id="${pfx}keyBox" class="hidden p-2.5 bg-zinc-900 border-b border-zinc-800 flex gap-1.5">
      <input type="password" id="${pfx}gKey" value="${localStorage.getItem('ks_gemini_key')||''}" placeholder="Gemini API Key" class="flex-1 bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-white"/>
      <button type="button" onclick="localStorage.setItem('ks_gemini_key',document.getElementById('${pfx}gKey').value.trim());showToast('Saved!')" class="px-2.5 py-1 rounded bg-rose-600 text-white font-bold">Save</button>
    </div>
    <div class="p-2 bg-zinc-950/60 border-b border-zinc-800 flex flex-wrap gap-1">${chips.map(c=>`<button type="button" onclick="askAi('${c}','${pfx}')" class="px-2 py-1 rounded-lg bg-zinc-900 hover:bg-rose-500/20 text-zinc-200 border border-zinc-800 text-[11px]">${c}</button>`).join('')}</div>
    <div id="${pfx}aiLog" class="flex-1 p-3 space-y-2 ${isDock?'overflow-y-auto':'min-h-[220px] max-h-[45vh] overflow-y-auto'}">
      <div class="p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-200">${k?'안녕하세요! 킹샷 전술 AI입니다. 질문을 선택하거나 입력해 주세요.':'Hello! Ask anything about Kingshot tactics.'}</div>
    </div>
    <div class="p-2.5 bg-zinc-950 border-t border-zinc-800 flex gap-1.5">
      <input id="${pfx}aiIn" onkeydown="if(event.key==='Enter')askAi(null,'${pfx}')" placeholder="${k?'전술 질문...':'Ask AI...'}" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-2.5 py-2 text-white"/>
      <button type="button" onclick="askAi(null,'${pfx}')" class="px-3 py-2 rounded-xl bg-rose-600 text-white font-bold">${k?'질문':'Ask'}</button>
    </div>
  </div>`;
}

function renderAi(){ document.getElementById('mainApp').innerHTML = getAiHtml(false); }
function renderPcAiDock(){ document.getElementById('pcAiDock').innerHTML = getAiHtml(true); }

async function askAi(preset, pfx){
  const inp=document.getElementById(pfx+'aiIn'), q=(preset||inp.value).trim(); if(!q)return; inp.value='';
  const log=document.getElementById(pfx+'aiLog'), k=lang==='ko';
  log.innerHTML+=`<div class="flex justify-end"><div class="p-2 rounded-xl bg-rose-600 text-white font-bold">${q}</div></div>`;
  const key=localStorage.getItem('ks_gemini_key');
  if(key){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Kingshot game strategy expert, concise in ${k?'Korean':'English'}: ${q}`}]}]})});
      const d=await r.json(), rep=d?.candidates?.[0]?.content?.parts?.[0]?.text;
      if(rep){log.innerHTML+=`<div class="p-2 rounded-xl bg-zinc-950 border border-zinc-800 whitespace-pre-wrap">${rep}</div>`;log.scrollTop=log.scrollHeight;return;}
    }catch(e){}
  }
  const s=q.toLowerCase(); let ans=k?'베어, 시련, 순금, 장비, 시설, 상점 키워드로 질문해 주세요!':'Ask about Bear, Trial, Truegold, Gear, Facilities, or Shops!';
  if(s.includes('베어')||s.includes('bear')||s.includes('조이너')) ans=k?'🐻 참여자 1번 슬롯: 첸코, 연우, 아마데우스, 아마네, 마고, 비비안만 배치! 병종 비율 보10:기10:궁80':'🐻 Slot 1 Joiners: Chenko, Yeonwoo, Amadeus, Amane, Margot, Vivian. Ratio 10:10:80.';
  else if(s.includes('시련')||s.includes('결투장')||s.includes('첨탑')||s.includes('trial')) ans=k?'✨ 첨탑: 1부대 50/15/35 · 2부대 50/35/15 · 3부대 50/20/30\n✨ 결투장: 1부대 50/10/40 · 2부대 40/40/20 · 3부대 50/20/30':'✨ Spire: 50/15/35, 50/35/15, 50/20/30 | Coliseum: 50/10/40, 40/40/20, 50/20/30';
  else if(s.includes('순금')||s.includes('truegold')) ans=k?'🏗️ 8개 건물 Lv.1~8 총합: 순금 31,422개 + 순정금 908개 (16주 분산 정제 추천)':'🏗️ All 8 buildings Lv.1–8: 31,422 Truegold + 908 Tempered TG.';
  else if(s.includes('장비')||s.includes('gear')) ans=k?'🛡️ 공격/살상력(장갑·부츠) 먼저 Lv.20→60→100, 방어 갑옷류는 Lv.59·79 멈춤! 전용무기 10강 총 275개.':'🛡️ Upgrade Gloves/Boots to 20→60→100 first; stop Armor at Lv.59/79. Exclusive Lv.10 = 275 parts.';
  else if(s.includes('시설')||s.includes('전초')||s.includes('facility')) ans=k?'🏰 연맹 깃발 75% 이상 덮어야 공격 가능, 무주지 15분 연속 점령 시 확정!':'🏰 Requires ≥75% banner coverage & 15m continuous hold.';
  log.innerHTML+=`<div class="p-2 rounded-xl bg-zinc-950 border border-zinc-800 whitespace-pre-wrap">${ans}</div>`;
  log.scrollTop=log.scrollHeight;
}

function renderTab(){
  ({search:renderSearch,rally:renderRally,bear:renderBear,kvk:renderKvk,sw:renderSw,tri:renderTri,fac:renderFac,tg:renderTg,hero:renderHero,shop:renderShop,mys:renderMys,mac:renderMac,notes:renderNotes,ai:renderAi})[curTab]();
}
