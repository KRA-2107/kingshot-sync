function t(ko, en, tr) {
  if (lang === 'ko') return ko;
  if (lang === 'tr') return tr || en;
  return en;
}

function setLang(newLang) {
  lang = newLang;
  localStorage.setItem('ks_lang', lang);
  ['ko', 'en', 'tr'].forEach(l => {
    const btn = document.getElementById('btnLang' + l.charAt(0).toUpperCase() + l.slice(1));
    if (btn) btn.className = l === lang
      ? "px-1.5 py-1 rounded-md bg-rose-600 text-white shadow"
      : "px-1.5 py-1 rounded-md text-slate-400 hover:text-white";
  });
  const d = I18N[lang];
  document.getElementById('lbl-dock-home').innerText = d.dockHome;
  document.getElementById('lbl-dock-search').innerText = d.dockSearch;
  document.getElementById('lbl-dock-kvk').innerText = d.dockKvk;
  document.getElementById('lbl-dock-ai').innerText = d.dockAi;
  document.getElementById('lbl-dock-all').innerText = d.dockAll;
  renderMenus();
  renderTab();
}

function renderMenus() {
  const tabs = I18N[lang].tabs;
  const html = tabs.map(item => `
    <button onclick="switchTab('${item.id}'); closeDrawer();"
      class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition ${curTab === item.id ? 'bg-rose-600/25 border border-rose-500/50 text-white' : 'text-slate-300 hover:bg-white/5'}">
      <span>${item.icon}</span><span class="truncate">${item.name}</span>
    </button>
  `).join('');
  const pcNav = document.getElementById('pcNavMenu');
  const drw = document.getElementById('drawerMenuList');
  if (pcNav) pcNav.innerHTML = html;
  if (drw) drw.innerHTML = html;

  const strip = document.getElementById('topQuickStrip');
  if (strip) {
    strip.innerHTML = tabs.map(item => `
      <button id="qtab-${item.id}" onclick="switchTab('${item.id}')"
        class="px-2.5 py-1 rounded-lg font-semibold shrink-0 transition ${curTab === item.id ? 'bg-rose-600 text-white shadow' : 'bg-slate-900/90 text-slate-300 border border-slate-800 hover:border-rose-500/40'}">
        ${item.icon} ${item.name.split('·')[0].trim()}
      </button>
    `).join('');
    const activeChip = document.getElementById('qtab-' + curTab);
    if (activeChip && activeChip.scrollIntoView) {
      activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }
}

function updateClock() {
  const now = new Date();
  const utcStr = now.toISOString().substring(11, 19);
  const kst = new Date(now.getTime() + 9 * 3600 * 1000);
  const kstStr = kst.toISOString().substring(11, 19);
  const el = document.getElementById('utcClock');
  if (el) el.innerText = `UTC ${utcStr} • KST ${kstStr}`;

  const target = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 10, 0, 0));
  const day = now.getUTCDay();
  let diffDays = (6 - day + 7) % 7;
  if (diffDays === 0 && now.getUTCHours() >= 10) diffDays = 7;
  target.setUTCDate(target.getUTCDate() + diffDays);
  const diff = Math.max(0, target - now);
  const dd = Math.floor(diff / 86400000);
  const hh = Math.floor((diff % 86400000) / 3600000);
  const mm = Math.floor((diff % 3600000) / 60000);
  const ss = Math.floor((diff % 60000) / 1000);
  const cd = document.getElementById('liveCountdown');
  if (cd) cd.innerText = `${dd}d ${String(hh).padStart(2,'0')}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;
}
setInterval(updateClock, 1000);

function formatStoveBadge(lv) {
  const n = Number(lv) || 30;
  if (n <= 30) return `<span class="px-2 py-0.5 rounded-md bg-sky-500/20 border border-sky-400/40 text-sky-300 font-mono-code text-[10px] font-bold">TC ${n}</span>`;
  const tg = n - 30;
  if (tg <= 3) return `<span class="px-2 py-0.5 rounded-md bg-purple-500/20 border border-purple-400/40 text-purple-300 font-mono-code text-[10px] font-bold">TG ${tg}</span>`;
  return `<span class="px-2 py-0.5 rounded-md bg-amber-500/25 border border-amber-400/50 text-amber-300 font-mono-code text-[10px] font-bold">TG ${tg}</span>`;
}

function copyText(txt) {

}

function runHubSearch() {
  const q = document.getElementById('hubSearchInput').value.trim();
  const msg = document.getElementById('searchStatusMsg');
  if (!q) { clearHubSearch(); return; }
  if (q.startsWith('#')) {
    const kNum = parseInt(q.replace('#', ''), 10);
    const filtered = playersCache.filter(p => Number(p.kid) === kNum);
    msg.innerHTML = `<span class="text-emerald-400 font-bold">#${kNum} ${t("왕국 검색 결과:", "Kingdom results:", "Krallık sonuçları:")} ${filtered.length}${t("명", "", "")}</span>`;
    renderMatchedCards(filtered);
    return;
  }
  const matches = playersCache.filter(p => String(p.fid) === q || (p.nickname && p.nickname.toLowerCase().includes(q.toLowerCase())));
  if (matches.length > 0) {
    msg.innerHTML = `<span class="text-emerald-400 font-bold">✓ ${t("일치하는 프로필", "Matched profiles", "Eşleşen profiller")}: ${matches.length}</span>`;
    renderMatchedCards(matches);
  } else if (/^\d+$/.test(q)) {
    const newEntry = { fid: q, nickname: `Governor_${q}`, kid: 2107, stove_lv: 30, power_memo: "Registered via Lookup" };
    playersCache.unshift(newEntry);
    localStorage.setItem('ks_players_local', JSON.stringify(playersCache));
    msg.innerHTML = `<span class="text-amber-300">⚡ ID ${q} ${t("신규 등록 및 조회 완료", "registered & loaded", "kaydedildi")}</span>`;
    renderMatchedCards([newEntry]);
  } else {
    renderMatchedCards([]);
    msg.innerHTML = `<span class="text-rose-400">${t("일치하는 플레이어가 없습니다. 숫자 ID를 입력하면 자동 등록 후 조회됩니다.", "No match found. Enter numeric ID to register & view.", "Eşleşme bulunamadı.")}</span>`;
  }
}

function calcKvK() {

    const val = Math.max(0, Number(document.getElementById('kvk_' + it.id)?.value) || 0);

    dayTotals[it.day] += pts;
    grandTotal += pts;
  });

function calcTroops() {
  const cap = Number(document.getElementById('marchCapInput')?.value) || 0;

  const summary = `[Troop Formation ${rInf}:${rCav}:${rArc}] Inf: ${inf.toLocaleString()} | Cav: ${cav.toLocaleString()} | Arc: ${arc.toLocaleString()}`;
  const box = document.getElementById('troopResultBox');

function convertUtc() {
  const val = document.getElementById('utcInput')?.value || "10:00";
  const [h, m] = val.split(':').map(Number);
  const kstH = (h + 9) % 24;
  const nextDay = h + 9 >= 24 ? " (+1d)" : "";
  const out = document.getElementById('kstOutput');
  if (out) out.innerText = `→ KST ${String(kstH).padStart(2,'0')}:${String(m).padStart(2,'0')}${nextDay}`;
}

function syncAiBoxes() {
  const html = aiHistory.map(m => `
    <div class="${m.role==='user' ? 'text-right' : 'text-left'}">
      <span class="inline-block px-3 py-2 rounded-xl ${m.role==='user' ? 'bg-rose-600 text-white' : 'bg-slate-900 border border-slate-700 text-slate-200'}">${m.text}</span>
    </div>
  `).join('');
  const pc = document.getElementById('pcAiMessages');
  const mob = document.getElementById('mobAiMessages');
  if (pc) { pc.innerHTML = html; pc.scrollTop = pc.scrollHeight; }
  if (mob) { mob.innerHTML = html; mob.scrollTop = mob.scrollHeight; }
}

function sendAi(src) {
  const inp = document.getElementById(src === 'pc' ? 'pcAiInput' : 'mobAiInput');
  const q = inp.value.trim();
  if (!q) return;
  inp.value = '';
  aiHistory.push({ role: 'user', text: q });
  const ql = q.toLowerCase();
  let ans = "KvK 표준 집결은 50:20:30, 수성은 60:20:20, 베어 헌트는 10:10:80(1번 슬롯 공격 버프 영웅 필수)을 권장합니다.";
  if (ql.includes('kvk') || ql.includes('최강') || ql.includes('점수') || ql.includes('관직')) ans = "⚔️ KvK 준비는 Day1 건설(총리대신+토목공정/순금·부적), Day2 룰렛(신흥과학), Day3 펫(고급표식 15,000점), Day4 훈련/영웅(참모장+전투동원/미스릴·망치)으로 진행되며 토요일 22:00 UTC 구조 요청 시 최대 90% 복구됩니다.";
  else if (ql.includes('시련') || ql.includes('mystic')) ans = "🏛️ 신비한 시련 6대 구역은 패배 시 도전 횟수가 차감되지 않으며, 지식의 전당 공격력 +20% 버프 후 시련 상점 미스릴을 1순위로 교환하세요.";
  else if (ql.includes('곰') || ql.includes('베어') || ql.includes('bear')) ans = "🐻 베어 헌트는 집결 참여 시 1번 슬롯에 공격/살상력 영웅(첸코·아마데우스·예온우)을 두고 병력 비율 10:10:80을 사용하세요.";
  else if (ql.includes('7') || ql.includes('찰스') || ql.includes('아바')) ans = "🧬 7세대(Gen 7) 영웅은 찰스(보병 전무 10강 1순위), 아바(궁병 집결·베어 극딜), 위&우(기동 기병)로 구성됩니다.";
  aiHistory.push({ role: 'ai', text: ans });
  syncAiBoxes();
}

function renderTab() {
  const map = {
    home: renderHome, search: renderSearch, rally: renderRally, battle: renderBattle, bear: renderBear,
    kvk: renderKvK, sw: renderSw, tri: renderTri, fac: renderFac,
    tg: renderTg, hero: renderHero, shop: renderShop, mys: renderMys,
    time: renderTime, mac: renderMac, notes: renderNotes, ai: renderAi
  };
  if (map[curTab]) map[curTab]();
}

document.addEventListener('DOMContentLoaded', () => {
  updateClock();
  setLang(lang);
  syncAiBoxes();
});
