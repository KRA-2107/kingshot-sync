function updateClock(){
  const d=new Date(), s=[d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  const m=document.getElementById('utcMobile'), p=document.getElementById('utcDesktop');
  if(m) m.textContent=s; if(p) p.textContent=s;
}
setInterval(updateClock,1000); updateClock();

function showToast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden');

}
function copyText(txt){
  navigator.clipboard.writeText(txt).then(()=>showToast(lang==='ko'?'복사 완료!':'Copied!'));

const SB_URL = "https://soyodukrsykhgsufwtth.supabase.co";

function formatStove(lv){
  if(!lv) return 'TC ?';
  return lv <= 30 ? 'TC ' + lv : 'TG ' + (lv - 30);
}

function timeAgo(iso){
  if(!iso) return '-';
  const diff = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if(diff < 60) return lang==='ko' ? diff + '분 전 갱신' : 'Updated ' + diff + 'm ago';
  const hr = Math.floor(diff / 60);
  return lang==='ko' ? hr + '시간 전 갱신' : 'Updated ' + hr + 'h ago';
}

async function sbFetch(path, opt){
  opt = opt || {};
  return fetch(SB_URL + '/rest/v1/' + path, {
    method: opt.method || 'GET',
    body: opt.body,
    headers: Object.assign({
      apikey: SB_KEY,
      Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    }, opt.headers || {})
  });
}

async function updatePlayerInline(fid){
  const nick = document.getElementById('edNick_' + fid).value.trim();
  const kid = parseInt(document.getElementById('edKid_' + fid).value) || null;
  const st = document.getElementById('edStove_' + fid).value;
  const stove_lv = st ? parseInt(st) : null;
  const payload = { fid: fid, updated_at: new Date().toISOString() };
  if(nick) payload.nickname = nick;
  if(kid) payload.kid = kid;
  if(stove_lv) payload.stove_lv = stove_lv;
  const res = await sbFetch('players', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify(payload)
  });
  if(res.ok){
    showToast(lang==='ko'?'프로필 저장 완료!':'Profile updated!');
    loadLiveLists();
  }
}

async function registerKingdomDb(){
  const kid = parseInt(document.getElementById('kRegId').value);
  const season_result = document.getElementById('kRegRes').value.trim();
  const transfer_group = parseInt(document.getElementById('kRegGrp').value) || null;
  if(!kid) return showToast(lang==='ko'?'왕국 번호를 입력하세요!':'Enter Kingdom #!');
  const res = await sbFetch('kingdoms', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify({ kid: kid, season_result: season_result, transfer_group: transfer_group, updated_at: new Date().toISOString() })
  });
  if(res.ok){
    document.getElementById('kRegId').value='';
    document.getElementById('kRegRes').value='';
    showToast(lang==='ko'?'왕국 정보 저장 완료!':'Kingdom saved!');
    loadLiveLists();
  }
}

async function runHubSearch(){
  const raw = document.getElementById('hubSearchIn').value.trim();
  const area = document.getElementById('searchResultArea');
  const k = lang==='ko';
  if(!raw){ area.innerHTML=''; return; }

  if(raw.startsWith('#')){
    const kid = parseInt(raw.slice(1));
    const [kRes, pRes] = await Promise.all([
      sbFetch('kingdoms?kid=eq.' + kid),
      sbFetch('players?kid=eq.' + kid + '&order=stove_lv.desc.nullslast')
    ]);
    const kData = await kRes.json(), pData = await pRes.json();
    const info = kData[0];
    area.innerHTML = `
      <div class="glass rounded-2xl p-4 border-purple-500/40 space-y-2">
        <div class="flex justify-between items-center">
          <b class="text-base text-purple-300">👑 Kingdom #${kid}</b>
          <span class="text-[11px] text-slate-400">${info ? timeAgo(info.updated_at) : (k?'미등록 왕국':'Unregistered')}</span>
        </div>
        <div class="text-slate-200">${info ? (k?'최근 전적':'Result') + ': <b>' + (info.season_result||'-') + '</b> · ' + (k?'전송 그룹':'Transfer Group') + ': <b>' + (info.transfer_group||'-') + '</b>' : (k?'아래 왕국 등록 칸에서 KvK 전적을 기록할 수 있습니다.':'Log KvK record below.')}</div>
        <div class="text-[11px] text-cyan-300">${k?'등록된 소속 플레이어: ' + pData.length + '명':'Tracked Players in #' + kid + ': ' + pData.length}</div>
      </div>`;
    return;
  }

  const isNum = /^\d+$/.test(raw);
  const query = isNum ? ('players?fid=eq.' + raw) : ('players?nickname=ilike.*' + encodeURIComponent(raw) + '*');
  const res = await sbFetch(query);
  const list = await res.json();

  if(isNum){
    const fid = parseInt(raw);
    area.innerHTML = `<div class="glass rounded-2xl p-4 border-cyan-500/40 text-cyan-300 font-mono-code">⏳ ${k?'프록시 서버를 통해 인게임 닉네임·왕국·도시센터 등급 자동 조회 중...':'Fetching live in-game Nickname, Kingdom & TC/TG via proxy...'}</div>`;
    let fetched = null;
    try {
      const pRes = await fetch('/.netlify/functions/ks-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'player', fid: String(fid) })
      });
      if (pRes.ok) {
        const pJson = await pRes.json();
        if (pJson?.ok && pJson?.data?.data) {
          fetched = pJson.data.data;
        }
      }
    } catch (e) {}

    const existing = (list && list[0]) ? list[0] : {};
    const merged = {
      fid: fid,
      nickname: fetched?.nickname || existing.nickname || ('Governor_' + fid),
      kid: fetched?.kid || existing.kid || null,
      stove_lv: fetched?.stove_lv || existing.stove_lv || null,
      avatar_image: fetched?.avatar_image || existing.avatar_image || null,
      updated_at: new Date().toISOString()
    };
    await sbFetch('players', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify(merged)
    });
    area.innerHTML = renderEditablePlayerCard(merged, Boolean(fetched) || !existing.fid);
    loadLiveLists();
    return;
  }

  if(!list || list.length===0){
    area.innerHTML = `<div class="glass rounded-2xl p-4 border-amber-500/40">${k?"'" + raw + "' 닉네임 검색 결과가 없습니다. 숫자 플레이어 ID를 입력하면 즉시 자동 등록됩니다!":"No nickname match for '" + raw + "'. Enter numeric Player ID to auto-register!"}</div>`;
    return;
  }
  area.innerHTML = list.map(p=>renderEditablePlayerCard(p, false)).join('');
}

async function addGiftCodeDb(){
  const code = document.getElementById('gcCodeIn').value.trim().toUpperCase();
  const reward = document.getElementById('gcRewIn').value.trim();
  if(!code) return showToast(lang==='ko'?'선물 코드를 입력하세요!':'Enter Gift Code!');
  const res = await sbFetch('gift_codes', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify({ code: code, reward: reward || 'Gift Pack', status: 'active', created_at: new Date().toISOString() })
  });
  if(res.ok){
    document.getElementById('gcCodeIn').value = '';
    document.getElementById('gcRewIn').value = '';
    document.getElementById('bulkCodeIn').value = code;
    showToast(lang==='ko'?'선물 코드 DB 등록 완료!':'Gift Code saved!');
    loadGiftCodes();
  } else {
    showToast(lang==='ko'?'gift_codes 테이블을 먼저 생성해 주세요!':'Create gift_codes table first!');
  }
}

    box.innerHTML = codes.length ? codes.map(c=>`

        <div>
          <b class="font-mono-code text-emerald-300 text-sm">${c.code}</b>

        </div>

        </div>
      </div>
    `).join('') : `<div class="col-span-2 text-slate-400 text-[11px]">${k?'등록된 선물 코드가 없습니다. 위 입력칸에 첫 코드를 등록해 보세요!':'No gift codes saved yet.'}</div>`;
  }catch(e){}
}

async function runBulkGiftRedeem(){
  const cdk = document.getElementById('bulkCodeIn').value.trim();
  const logBox = document.getElementById('bulkLogBox');
  const k = lang==='ko';
  if(!cdk) return showToast(k?'발송할 선물 코드를 입력하세요!':'Enter Gift Code!');
  logBox.classList.remove('hidden');
  logBox.innerHTML = `<div class="text-amber-300">⏳ ${k?'DB 등록 플레이어 목록 조회 중...':'Fetching tracked players...'}</div>`;

  const pRes = await sbFetch('players?select=fid,nickname');
  const players = await pRes.json();
  if(!players || !players.length){
    logBox.innerHTML = `<div class="text-rose-400">${k?'등록된 플레이어가 없습니다.':'No registered players found.'}</div>`;
    return;
  }

  logBox.innerHTML = `<div class="text-cyan-300">🚀 [${cdk}] ${k?`총 ${players.length}명 대상 순차 발송 시작...`:`Starting batch redeem for ${players.length} players...`}</div>`;

  for(const p of players){
    const label = `${p.nickname || 'Governor'} (${p.fid})`;
    try{
      const r2 = await fetch('/.netlify/functions/ks-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'redeem', fid: String(p.fid), cdk: cdk })
      });
      const pJson = await r2.json();
      if(pJson?.ok && pJson?.data){
        const j2 = pJson.data;
        const ok = j2?.code === 0 || j2?.err_code === 20000;
        const msg = j2?.msg || (ok ? 'SUCCESS' : 'CODE_' + (j2?.err_code || j2?.code));
        logBox.innerHTML += `<div class="${ok?'text-emerald-400':'text-amber-300'}">${ok?'✅':'⚠️'} ${label} → ${msg}</div>`;
      } else {
        logBox.innerHTML += `<div class="text-rose-400">⚠️ ${label} → ${pJson?.error || 'Proxy blocked'}</div>`;
      }
    }catch(err){
      logBox.innerHTML += `<div class="text-rose-400">⚠️ ${label} → ${k?'프록시 연결 실패 (Netlify Functions 배포 확인)':'Proxy error'}</div>`;
    }
    logBox.scrollTop = logBox.scrollHeight;
    await new Promise(r=>setTimeout(r, 900));
  }
  logBox.innerHTML += `<div class="text-emerald-300 font-bold">✔ ${k?'일괄 발송 작업 완료!':'Batch redeem finished!'}</div>`;
}

async function loadLiveLists(){
  const k = lang==='ko';
  const pBox = document.getElementById('livePlayersBox'), kBox = document.getElementById('liveKingdomsBox');
  if(!pBox || !kBox) return;
  pBox.innerHTML = '<div class="text-slate-400">Loading Supabase DB...</div>';
  try{
    const [pRes, kRes] = await Promise.all([
      sbFetch('players?select=*&order=updated_at.desc&limit=30'),
      sbFetch('kingdoms?select=*&order=updated_at.desc&limit=15')
    ]);
    const players = await pRes.json(), kingdoms = await kRes.json();
    pBox.innerHTML = players.length ? players.map(p=>`
      <div onclick="document.getElementById('hubSearchIn').value='${p.fid}';runHubSearch()" class="cursor-pointer p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800/90 border border-slate-800 flex items-center justify-between">
        <div>
          <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono-code font-bold text-[10px] mr-1.5">${formatStove(p.stove_lv)}</span>
          <b class="text-white">${p.nickname || 'Governor'}</b>
          <span class="text-slate-400 text-[11px] ml-1">#${p.kid || '?'} · ID:${p.fid}</span>
        </div>
        <span class="text-[10px] text-emerald-400 font-mono-code">${timeAgo(p.updated_at)}</span>
      </div>
    `).join('') : `<div class="p-3 rounded-xl bg-slate-900 text-slate-400">${k?'아직 등록된 플레이어가 없습니다. 상단 검색창에 숫자 ID를 검색하면 즉시 등록됩니다!':'No tracked players yet. Search a numeric Player ID above to auto-register!'}</div>`;

    kBox.innerHTML = kingdoms.length ? kingdoms.map(x=>`
      <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
        <div>
          <b class="text-purple-300">Kingdom #${x.kid}</b>
          <div class="text-[11px] text-slate-300">${x.season_result || '-'} ${x.transfer_group ? '(Group ' + x.transfer_group + ')' : ''}</div>
        </div>
        <span class="text-[10px] text-slate-400 font-mono-code">${timeAgo(x.updated_at)}</span>
      </div>
    `).join('') : `<div class="p-3 rounded-xl bg-slate-900 text-slate-400">${k?'등록된 왕국 기록이 없습니다.':'No kingdom records yet.'}</div>`;
  }catch(e){
    pBox.innerHTML = '<div class="text-rose-400">Connection Error</div>';
  }
}

function calcKvkRally(){
  const pts=document.getElementById('eHit').value.trim().split(':').map(Number);
  const out=document.getElementById('rOut'), k=lang==='ko';
  if(pts.length!==3||pts.some(isNaN)){out.innerHTML=`<div class="text-xs text-rose-400">HH:MM:SS</div>`;return;}
  const hit=pts[0]*3600+pts[1]*60+pts[2], prep=parseInt(document.getElementById('rPrep').value)||300;
  const fmt=s=>{s=((s%86400)+86400)%86400;return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');};
  out.innerHTML=[1,2,3].map(i=>{
    const m=parseInt(document.getElementById('m'+i).value)||0, imp=hit+i, op=imp-m-prep;
    return `<div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex justify-between items-center text-xs"><div><b class="text-rose-400">${k?`B팀 ${i}집결 (+${i}s)`:`Team B Rally #${i} (+${i}s)`}</b><div class="text-[11px] text-slate-400">${k?'도착':'Hit'}: ${fmt(imp)}</div></div><div class="text-right"><div class="text-[10px] text-slate-400">${k?'개시(UTC)':'Open'}</div><b class="font-mono-code text-sm text-amber-400">${fmt(op)}</b></div></div>`;
  }).join('');
}

  const inp=document.getElementById(pfx+'aiIn'), q=(preset||inp.value).trim(); if(!q)return; inp.value='';

  const key=localStorage.getItem('ks_gemini_key');
  if(key){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Kingshot game strategy expert, concise in ${k?'Korean':'English'}: ${q}`}]}]})});

    }catch(e){}
  }
