async function supaFetch(path, options = {}) {
  const headers = {
    "apikey": SUPA_KEY,
    "Authorization": `Bearer ${SUPA_KEY}`,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { ...options, headers });

  const text = await res.text();
  return text ? JSON.parse(text) : [];

// ================= UTC CLOCK & LIVE KVK COUNTDOWN =================
function updateClock() {
  const now = new Date();
  const utcStr = now.toISOString().substring(11, 19);
  const kst = new Date(now.getTime() + 9 * 3600 * 1000);
  const kstStr = kst.toISOString().substring(11, 19);
  const el = document.getElementById('utcClock');
  if (el) el.innerText = `UTC ${utcStr} • KST ${kstStr}`;

  // Next Saturday 10:00 UTC (KvK Castle / Border)
  const target = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 10, 0, 0));
  const day = now.getUTCDay();
  let diffDays = (6 - day + 7) % 7;
  if (diffDays === 0 && now.getUTCHours() >= 10) diffDays = 7;
  target.setUTCDate(target.getUTCDate() + diffDays);
  const diff = Math.max(0, target - now);
  const dd = Math.floor(diff / 86400000);
  const hh = Math.floor((diff % 86400000) / 3600000);
  const mm = Math.floor((diff % 3600000) / 60000);
  const ss = Math.floor((diff % 60000) / 1000);
  const cd = document.getElementById('liveCountdown');
  if (cd) cd.innerText = `${dd}d ${String(hh).padStart(2,'0')}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;
}
setInterval(updateClock, 1000);

}

function runHubSearch() {
  const q = document.getElementById('hubSearchInput').value.trim();
  const msg = document.getElementById('searchStatusMsg');
  if (!q) return;
  if (q.startsWith('#')) {
    const kNum = parseInt(q.replace('#', ''), 10);
    const filtered = playersCache.filter(p => Number(p.kid) === kNum);
    msg.innerHTML = `<span class="text-emerald-400 font-bold">#${kNum} ${t("왕국 필터 결과:", "Kingdom matches:", "Krallık sonuçları:")} ${filtered.length}</span>`;
    return;
  }
  const found = playersCache.find(p => String(p.fid) === q || (p.nickname && p.nickname.toLowerCase().includes(q.toLowerCase())));
  if (found) {
    msg.innerHTML = `<span class="text-emerald-400 font-bold">✓ ${found.nickname} (ID: ${found.fid}, #${found.kid})</span>`;
  } else if (/^\d+$/.test(q)) {
    playersCache.unshift({ fid: q, nickname: `Governor_${q}`, kid: 2107, stove_lv: 30, power_memo: "Queued / New" });
    localStorage.setItem('ks_players_local', JSON.stringify(playersCache));
    renderSearch();
    document.getElementById('searchStatusMsg').innerHTML = `<span class="text-amber-300">⚡ ID ${q} ${t("등록 완료 (수동 수정 가능)", "registered to tracker", "kaydedildi")}</span>`;
  } else {
    msg.innerHTML = `<span class="text-rose-400">${t("일치하는 플레이어가 없습니다. 숫자 ID를 입력하면 자동 등록됩니다.", "Not found. Enter numeric ID to register.", "Bulunamadı.")}</span>`;
  }
}

function addManualPlayerPrompt() {
  const fid = prompt(t("플레이어 숫자 ID 입력:", "Enter Player ID:", "Oyuncu ID:"));
  if (!fid) return;
  const nickname = prompt(t("닉네임 입력:", "Enter Nickname:", "Takma ad:")) || `Governor_${fid}`;
  const lv = parseInt(prompt(t("도시센터 레벨 (예: 30 = TC30, 35 = TG5):", "Furnace Lv (30=TC30, 35=TG5):", "Ocak Sv (30=TC30, 35=TG5):"), "33"), 10) || 30;
  playersCache.unshift({ fid, nickname, kid: 2107, stove_lv: lv, power_memo: "Manual Entry" });
  localStorage.setItem('ks_players_local', JSON.stringify(playersCache));
  renderSearch();
}

function removePlayer(idx) {
  playersCache.splice(idx, 1);
  localStorage.setItem('ks_players_local', JSON.stringify(playersCache));
  renderSearch();
}

function setRatio(i, c, a) { rInf = i; rCav = c; rArc = a; calcTroops(); }
function renderRally() {
  document.getElementById('appMain').innerHTML = `

    </div>

  calcTroops();

function calcTroops() {
  const cap = Number(document.getElementById('marchCapInput')?.value) || 0;
  const inf = Math.round(cap * (rInf / 100));
  const cav = Math.round(cap * (rCav / 100));
  const arc = cap - inf - cav;
  const summary = `[Troop Formation ${rInf}:${rCav}:${rArc}] Inf: ${inf.toLocaleString()} | Cav: ${cav.toLocaleString()} | Arc: ${arc.toLocaleString()}`;
  const box = document.getElementById('troopResultBox');
  if (!box) return;
  box.innerHTML = `
    <div class="flex justify-between items-center font-mono-code">
      <span class="text-sky-300">🛡️ ${t("보병", "Infantry", "Piyade")} (${rInf}%)</span>
      <b class="text-sm text-white">${inf.toLocaleString()}</b>
    </div>
    <div class="flex justify-between items-center font-mono-code">
      <span class="text-amber-300">🐎 ${t("기병", "Cavalry", "Süvari")} (${rCav}%)</span>
      <b class="text-sm text-white">${cav.toLocaleString()}</b>
    </div>
    <div class="flex justify-between items-center font-mono-code">
      <span class="text-rose-300">🏹 ${t("궁병", "Marksman", "Nişancı")} (${rArc}%)</span>
      <b class="text-sm text-white">${arc.toLocaleString()}</b>

  `;
}

  const out = document.getElementById('bearCalcOut');
  if (out) out.innerHTML = `
    <div>🔄 ${t("1회 왕복 주기 (집결 5분 + 왕복):", "Full Cycle (5m + Roundtrip):", "Tam Döngü:")} <b class="text-amber-300">${cycle}s (${(cycle/60).toFixed(1)}m)</b></div>

function calcT10() {
  const types = Number(document.getElementById('t10Types')?.value) || 1;
  const prog = Math.min(100, Math.max(0, Number(document.getElementById('t10Prog')?.value) || 0));
  const remRatio = (100 - prog) / 100;
  const dust = Math.round(13500 * types * remRatio);
  const tg = Math.round(4200 * types * remRatio);
  const el = document.getElementById('t10Out');
  if (el) el.innerHTML = `
    <div>✨ ${t("남은 필요 순금 가루 (Truegold Dust):", "Remaining Truegold Dust:", "Kalan Saf Altın Tozu:")} <b class="text-amber-300">${dust.toLocaleString()}</b></div>

}

    <h2 class="font-display font-bold text-base text-white">⏰ ${t("UTC ↔ KST 실시간 시간 변환 & 연맹 알람", "UTC ↔ KST Time Converter", "UTC Saat Dönüştürücü")}</h2>

      <input id="utcInput" oninput="convertUtc()" type="time" value="10:00" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 font-mono-code text-white">
      <div id="kstOutput" class="font-mono-code font-bold text-amber-300 text-sm">→ KST 19:00</div>
    </div>
    <div class="grid grid-cols-2 gap-1.5">
      <button onclick="document.getElementById('utcInput').value='00:00';convertUtc()" class="py-1.5 rounded-lg bg-slate-900 border border-slate-700 font-mono-code">00:00 UTC (일일 리셋)</button>
      <button onclick="document.getElementById('utcInput').value='10:00';convertUtc()" class="py-1.5 rounded-lg bg-slate-900 border border-slate-700 font-mono-code">10:00 UTC (KvK 왕성)</button>
      <button onclick="document.getElementById('utcInput').value='12:00';convertUtc()" class="py-1.5 rounded-lg bg-slate-900 border border-slate-700 font-mono-code">12:00 UTC (베어/성검)</button>
      <button onclick="document.getElementById('utcInput').value='23:50';convertUtc()" class="py-1.5 rounded-lg bg-slate-900 border border-slate-700 font-mono-code">23:50 UTC (관직 예약)</button>
    </div>
  </div>`;
  convertUtc();
}
function convertUtc() {
  const val = document.getElementById('utcInput')?.value || "10:00";
  const [h, m] = val.split(':').map(Number);
  const kstH = (h + 9) % 24;
  const nextDay = h + 9 >= 24 ? " (+1d)" : "";
  const out = document.getElementById('kstOutput');
  if (out) out.innerText = `→ KST ${String(kstH).padStart(2,'0')}:${String(m).padStart(2,'0')}${nextDay}`;
}

// ================= TAB 16: TACTICAL AI =================
const aiHistory = [{ role: 'ai', text: 'KINGSHOT hub v0.6.0 전술 AI입니다. 베어 헌트(10:10:80), KvK 3중 카운터, Gen 7(찰스·아바·위우), T10 불꽃 해금 비용 등 무엇이든 물어보세요!' }];
function renderAi() {
  document.getElementById('appMain').innerHTML = `
  <div class="tac-card-crimson rounded-2xl p-4 space-y-3 text-xs">
    <h2 class="font-display font-bold text-base text-white">🤖 ${t("전술 AI 어시스턴트 (내장 DB v0.6.0)", "Tactical AI Assistant", "Taktik AI Asistanı")}</h2>
    <div id="mobAiMessages" class="h-80 overflow-y-auto space-y-2 bg-slate-950/70 rounded-xl p-3 border border-slate-800"></div>
    <div class="flex gap-2">
      <input id="mobAiInput" onkeydown="if(event.key==='Enter')sendAi('mob')" type="text" placeholder="${t("질문 입력 (예: 곰 사냥 비율, 7세대 영웅)", "Ask about Bear, KvK, Gen 7...", "Soru sor...")}" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white">
      <button onclick="sendAi('mob')" class="btn-tap px-4 py-2.5 rounded-xl bg-rose-600 text-white font-bold shrink-0">전송</button>
    </div>
  </div>`;
  syncAiBoxes();
}

function syncAiBoxes() {
  const html = aiHistory.map(m => `
    <div class="${m.role==='user' ? 'text-right' : 'text-left'}">
      <span class="inline-block px-3 py-2 rounded-xl ${m.role==='user' ? 'bg-rose-600 text-white' : 'bg-slate-900 border border-slate-700 text-slate-200'}">${m.text}</span>
    </div>
  `).join('');
  const pc = document.getElementById('pcAiMessages');
  const mob = document.getElementById('mobAiMessages');
  if (pc) { pc.innerHTML = html; pc.scrollTop = pc.scrollHeight; }
  if (mob) { mob.innerHTML = html; mob.scrollTop = mob.scrollHeight; }
}

function sendAi(src) {
  const inp = document.getElementById(src === 'pc' ? 'pcAiInput' : 'mobAiInput');
  const q = inp.value.trim();
  if (!q) return;
  inp.value = '';
  aiHistory.push({ role: 'user', text: q });
  const ql = q.toLowerCase();
  let ans = "KvK 표준 집결은 50:20:30, 수성은 60:20:20, 베어 헌트는 10:10:80(1번 슬롯 공격 버프 영웅 필수)을 권장합니다.";
  if (ql.includes('곰') || ql.includes('베어') || ql.includes('bear')) ans = "🐻 베어 헌트는 집결 참여 시 1번 슬롯에 공격/살상력 영웅(첸코·아마데우스·예온우)을 두고 병력 비율 10:10:80을 사용하세요.";
  else if (ql.includes('7') || ql.includes('찰스') || ql.includes('아바')) ans = "🧬 7세대(Gen 7) 영웅은 찰스(보병 전무 10강 1순위), 아바(궁병 집결·베어 극딜), 위&우(기동 기병)로 구성됩니다.";
  else if (ql.includes('t10') || ql.includes('불꽃') || ql.includes('순금')) ans = "🔥 T10 불꽃 병력은 병종당 순금 가루 약 13,500개와 순금 4,200개가 필요하며, 상급 순금 연구 탭에서 남은 수량을 계산할 수 있습니다.";
  else if (ql.includes('성검') || ql.includes('sword')) ans = "🗡️ 성검 쟁탈전은 왕실 마구간(-50% 텔레포트)과 종탑(-50% 점령)을 최우선 확보하고, 열세 시 전장 이탈(12분 쿨타임) 후 빈 거점 최초 점령 점수를 노리세요.";
  aiHistory.push({ role: 'ai', text: ans });
  syncAiBoxes();
}

function renderTab() {
  const map = {
    search: renderSearch, rally: renderRally, battle: renderBattle, bear: renderBear,
    kvk: renderKvK, sw: renderSw, tri: renderTri, fac: renderFac,
    tg: renderTg, hero: renderHero, shop: renderShop, mys: renderMys,
    time: renderTime, mac: renderMac, notes: renderNotes, ai: renderAi
  };
  if (map[curTab]) map[curTab]();
}

document.addEventListener('DOMContentLoaded', () => {
  updateClock();
  setLang(lang);
  syncAiBoxes();
});
</script>
