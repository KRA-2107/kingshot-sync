<script>
/* ==================== SUPABASE & STATE ==================== */
const SUPABASE_URL = 'https://soyodukrsykhgsufwtth.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mHkDQ668sCfxQSJO61qAGA_vkbw_I94';
let sb = null;
try { if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

function stoveToLabel(lv){
  const n = parseInt(lv);
  if(!n) return 'TC30';
  return n <= 30 ? 'TC' + n : 'TG' + (n - 30);
}
function labelToStove(lbl){
  const s = String(lbl||'TC30').toUpperCase();
  if(s.startsWith('TG')) return 30 + (parseInt(s.replace(/\D/g,'')) || 1);
  return parseInt(s.replace(/\D/g,'')) || 30;
}
function mapDbRowToUi(r){
  return {
    player_id: String(r.fid ?? r.player_id ?? ''),
    nickname: r.nickname || ('Governor_' + (r.fid||'')),
    kingdom: r.kid != null ? String(r.kid) : (r.kingdom || ''),
    tc_level: r.stove_lv != null ? stoveToLabel(r.stove_lv) : (r.tc_level || 'TC30'),
    power: parseInt(String(r.power_memo || r.power || '0').replace(/\D/g,'')) || 0,
    updated_at: r.updated_at || ''
  };
}

let lang = localStorage.getItem('ks_lang') || (navigator.language.startsWith('ko') ? 'ko' : 'en');
let curTab = 'home';
let prepDay = 1, swScen = 'win', mZone = 'spire', simPreset = 'pvp';
let playersDB = JSON.parse(localStorage.getItem('ks_players_cache') || '[]');
let giftDB = JSON.parse(localStorage.getItem('ks_gifts_cache') || '[]');
let swRos = JSON.parse(localStorage.getItem('ks_sw_roster') || '[]');
let triRos = JSON.parse(localStorage.getItem('ks_tri_roster') || '[]');
let activePlayer = JSON.parse(localStorage.getItem('ks_active_player') || 'null');
let kingdomFilter = 'ALL';

/* ==================== CLOCK & LIVE COUNTDOWNS ==================== */
function pad(n){ return String(n).padStart(2,'0'); }
function updateTimers(){
  const now = new Date();
  const utcStr = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;
  const elTop = document.getElementById('utcTop');
  if(elTop) elTop.textContent = utcStr;

  // Daily Reset (00:00 UTC)
  const nextReset = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0);
  const diffReset = Math.max(0, Math.floor((nextReset - now.getTime()) / 1000));
  const rh = Math.floor(diffReset / 3600), rm = Math.floor((diffReset % 3600) / 60), rs = diffReset % 60;

  // Next Saturday 10:00 UTC (KvK Battle Phase / Castle Cycle)
  const day = now.getUTCDay();
  let daysToSat = (6 - day + 7) % 7;
  let nextSat = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + daysToSat, 10, 0, 0);
  if (nextSat <= now.getTime()) nextSat += 7 * 86400 * 1000;
  const diffKvk = Math.max(0, Math.floor((nextSat - now.getTime()) / 1000));
  const kd = Math.floor(diffKvk / 86400), kh = Math.floor((diffKvk % 86400) / 3600), km = Math.floor((diffKvk % 3600) / 60);

  const elKvkD = document.getElementById('liveKvkDays');
  const elKvkSub = document.getElementById('liveKvkSub');
  const elReset = document.getElementById('liveResetTimer');
  if(elKvkD) elKvkD.textContent = kd > 0 ? `${kd}d ${pad(kh)}h` : `${pad(kh)}:${pad(km)}:${pad(diffKvk%60)}`;
  if(elKvkSub) elKvkSub.textContent = `Sat 10:00 UTC (${kh}h ${km}m)`;
  if(elReset) elReset.textContent = `${pad(rh)}:${pad(rm)}:${pad(rs)}`;
}
setInterval(updateTimers, 1000);

/* ==================== SUPABASE SYNC ==================== */
async function syncFromSupabase(){
  if(!sb) return;
  try {
    const { data: pData } = await sb.from('players').select('*').order('updated_at', { ascending: false });
    if(pData){
      playersDB = pData.map(mapDbRowToUi);
      localStorage.setItem('ks_players_cache', JSON.stringify(playersDB));
      if(activePlayer){
        const fresh = playersDB.find(x => x.player_id === activePlayer.player_id);
        if(fresh) setActiveProfile(fresh, false);
      } else if(playersDB[0]){
        setActiveProfile(playersDB[0], false);
      }
    }
    const { data: gData } = await sb.from('gift_codes').select('*').order('created_at', { ascending: false });
    if(gData){
      giftDB = gData;
      localStorage.setItem('ks_gifts_cache', JSON.stringify(giftDB));
    }
    if(curTab === 'home' || curTab === 'roster' || curTab === 'gift') renderTab();
  } catch(e) {}
}

function setActiveProfile(p, toast=true){
  activePlayer = p;
  localStorage.setItem('ks_active_player', JSON.stringify(p));
  const nm = document.getElementById('activeProfileName');
  const av = document.getElementById('activeAvatar');
  if(nm) nm.textContent = p ? `${p.nickname} (#${p.kingdom||'-'})` : (lang==='ko'?'프로필 등록':'Register');
  if(av) av.textContent = p && p.nickname ? p.nickname[0].toUpperCase() : 'K';
  if(toast) showToast(lang==='ko'?`활성 프로필: ${p.nickname}`:`Active: ${p.nickname}`);
}

/* ==================== NAVIGATION & DRAWER ==================== */
const MENU_ITEMS = [
  ['home', '🏠 대시보드 허브', '🏠 Command Hub'],
  ['roster', '🔍 플레이어 & 왕국 통계', '🔍 Players & Kingdom Stats'],
  ['gift', '🎁 선물 코드 & 일괄 발송', '🎁 Gift Codes & Batch'],
  ['sim', '🧮 랠리·수성 병력 시뮬레이터', '🧮 Troop Ratio Simulator'],
  ['bear', '🐻 베어 헌트 계산기', '🐻 Bear Hunt Calc'],
  ['kvk', '⚔️ 최강 왕국 (KvK)', '⚔️ Kingdom of Power'],
  ['sw', '🗡️ 성검 쟁탈전 (30vs30)', '🗡️ Swordland Showdown'],
  ['tri', '🚩 삼대연맹전 (60분)', '🚩 Tri-Alliance Clash'],
  ['fac', '🏰 시설 & 전초기지', '🏰 Facilities & Outposts'],
  ['tg', '🏗️ 순금 & 정제 계산기', '🏗️ Truegold & Refine'],
  ['hero', '🧬 영웅 · 장비 · 전용무기', '🧬 Heroes & Gear'],
  ['shop', '🛒 11대 상점 & 버프표', '🛒 Shops & Buff Matrix'],
  ['mys', '✨ 신비한 시련 & 바이킹', '✨ Mystic Trial & Viking'],
  ['mac', '📢 연맹 공지 (3종 복사)', '📢 Alliance Macros'],
  ['ai', '🤖 전술 AI 어시스턴트', '🤖 Tactical AI'],
  ['notes', '📋 개발자 노트 (v0.5.1)', '📋 Dev Notes (v0.5.1)']
];

function toggleDrawer(open){
  const d = document.getElementById('menuDrawer');
  if(open){
    const k = lang==='ko';
    document.getElementById('drawerLinks').innerHTML = MENU_ITEMS.map(([id,ko,en])=>`
      <button type="button" onclick="goTab('${id}');toggleDrawer(false)" class="w-full text-left px-3 py-2.5 rounded-xl border font-bold flex items-center justify-between ${curTab===id?'bg-sky-500/15 border-sky-400 text-sky-300':'bg-[#151c28] border-slate-800/80 text-slate-300 hover:border-slate-600'}">
        <span>${k?ko:en}</span><span class="text-slate-500">›</span>
      </button>`).join('');
    d.classList.remove('hidden');
  } else {
    d.classList.add('hidden');
  }
}

function goTab(id){
  curTab = id;
  ['home','kvk','roster','sim'].forEach(c=>{
    const el = document.getElementById('chip-'+c);
    if(el) el.classList.toggle('active', c===id);
  });
  ['home','roster','bear','ai'].forEach(d=>{
    const el = document.getElementById('dock-'+d);
    if(el) el.className = `py-1 rounded-xl flex flex-col items-center gap-0.5 ${d===id||(d==='bear'&&id==='kvk')?'text-sky-400':'text-slate-400'}`;
  });
  renderTab();
  window.scrollTo({top:0, behavior:'smooth'});
}

function setLang(l){
  lang = l;
  localStorage.setItem('ks_lang', l);
  document.getElementById('btnKo').className = l==='ko'?'px-2 py-0.5 rounded bg-sky-500 text-slate-950':'px-2 py-0.5 rounded text-slate-400';
  document.getElementById('btnEn').className = l==='en'?'px-2 py-0.5 rounded bg-sky-500 text-slate-950':'px-2 py-0.5 rounded text-slate-400';
  const k = l==='ko';
  document.getElementById('topSearchInput').placeholder = k ? '플레이어 ID 또는 #왕국... 검색' : 'Search Player ID or #Kingdom...';
  const map = {goBtn:['이동','Go'],cHome:['허브','Hub'],cKingdom:['왕국','Kingdom'],cSim:['병력 비율','Troop Sim'],dHome:['홈','Home'],dSearch:['왕국/검색','Roster'],dBear:['베어/KvK','Bear/KvK'],dAi:['전술 AI','Tactical AI'],dMenu:['전체메뉴','Menu']};
  Object.entries(map).forEach(([id,[ko,en]])=>{ const el=document.getElementById(id); if(el) el.textContent = k?ko:en; });
  setActiveProfile(activePlayer, false);
  renderTab();
}

function showToast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'), 2000);
}
function copyText(txt){
  navigator.clipboard.writeText(txt).then(()=>showToast(lang==='ko'?'클립보드에 복사되었습니다!':'Copied to clipboard!'));
}

function handleTopSearch(){
  const raw = document.getElementById('topSearchInput').value.trim();

  goTab('roster');
  setTimeout(()=>{

    if(inp){ inp.value = raw; searchOrLookupPlayer(); }
  }, 40);
}

function copyAllianceSummaryCard(){
  const k = lang==='ko';
  const total = playersDB.length;
  const tgList = playersDB.map(p=>`${p.nickname}(#${p.kingdom||'?'} / ${p.tc_level||'TC30'})`).join(', ') || (k?'등록된 인원 없음':'No members yet');
  const txt = k
    ? `[👑 Kingshot Tactical Hub v0.5.1 연맹 현황]\n• 등록 연맹원: ${total}명 (평균 전투력: ${total?Math.round(playersDB.reduce((a,b)=>a+(Number(b.power)||0),0)/total).toLocaleString():0})\n• 명단: ${tgList}`
    : `[👑 Kingshot Tactical Hub v0.5.1 Roster]\n• Registered: ${total} players\n• List: ${tgList}`;
  copyText(txt);
}

function calcSim(){
  const cap = parseInt(document.getElementById('simCap').value) || 100000;
  const i = parseFloat(document.getElementById('simI').value) || 0;
  const c = parseFloat(document.getElementById('simC').value) || 0;
  const a = parseFloat(document.getElementById('simA').value) || 0;
  const sum = i + c + a;
  const k = lang==='ko';
  const nI = Math.round(cap * i / 100), nC = Math.round(cap * c / 100), nA = Math.round(cap * a / 100);

  document.getElementById('simOut').innerHTML = `
    <div class="flex justify-between items-center text-xs">
      <span class="text-slate-400">${k?'비율 합계':'Total Ratio'}: <b class="${sum===100?'text-emerald-400':'text-rose-400'} font-mono-code">${sum}%</b></span>
      <button type="button" onclick="copyText('[🧮 병력 편성] 보병 ${nI.toLocaleString()} (${i}%) / 기병 ${nC.toLocaleString()} (${c}%) / 궁병 ${nA.toLocaleString()} (${a}%)')" class="px-2.5 py-1 rounded-lg bg-sky-500 text-slate-950 font-bold text-[11px]">${k?'편성 복사':'Copy Counts'}</button>
    </div>
    <div class="w-full h-3 rounded-full overflow-hidden flex bg-slate-900">
      <div style="width:${Math.min(100,i)}%" class="bg-blue-500"></div>
      <div style="width:${Math.min(100,c)}%" class="bg-emerald-500"></div>
      <div style="width:${Math.min(100,a)}%" class="bg-amber-500"></div>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="p-3 rounded-xl bg-slate-950 border border-blue-500/35"><div class="text-blue-400 font-bold">${k?'보병 (Infantry)':'Infantry'}</div><div class="font-mono-code font-black text-base text-white mt-0.5">${nI.toLocaleString()}</div></div>
      <div class="p-3 rounded-xl bg-slate-950 border border-emerald-500/35"><div class="text-emerald-400 font-bold">${k?'기병 (Cavalry)':'Cavalry'}</div><div class="font-mono-code font-black text-base text-white mt-0.5">${nC.toLocaleString()}</div></div>

    </div>`;
}

function getTierBadge(tc){
  const t = (tc||'TC30').toUpperCase();
  if(t.includes('TG4')||t.includes('TG5')||t.includes('TG6')||t.includes('TG7')||t.includes('TG8')) return 'bg-amber-500/20 text-amber-300 border-amber-400/50';
  if(t.includes('TG')) return 'bg-purple-500/20 text-purple-300 border-purple-400/50';
  return 'bg-sky-500/20 text-sky-300 border-sky-400/50';
}

async function searchOrLookupPlayer(){
  const q = document.getElementById('rosterQuery').value.trim();
  const st = document.getElementById('lookupStatus');
  if(!q) return;
  if(q.startsWith('#')){
    kingdomFilter = q.slice(1);
    renderRoster();
    return;
  }
  const existing = playersDB.find(p=>String(p.player_id)===q || (p.nickname||'').toLowerCase()===q.toLowerCase());
  if(existing){
    setActiveProfile(existing);
    st.innerHTML = `<span class="text-emerald-400">✅ DB에서 [${existing.nickname}] 프로필을 불러왔습니다.</span>`;
    return;
  }
  document.getElementById('regId').value = q;
  st.innerHTML = `<span class="text-amber-300">🟡 신규 ID(${q})입니다. 아래에 닉네임과 왕국을 입력해 등록하세요!</span>`;
  try {
    const res = await fetch('/.netlify/functions/ks-proxy', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'player', fid:q }) });
    if(res.ok){
      const d = await res.json();
      if(d && d.data && d.data.nickname){
        document.getElementById('regNick').value = d.data.nickname;
        if(d.data.kid) document.getElementById('regKingdom').value = d.data.kid; if(d.data.stove_lv) document.getElementById('regTc').value = stoveToLabel(d.data.stove_lv);
        st.innerHTML = `<span class="text-emerald-400">🟢 공식 서버 연동 성공: ${d.data.nickname} (#${d.data.kid||''})</span>`;
      }
    }
  } catch(e) {}
}

async function savePlayerProfile(){
  const pid = document.getElementById('regId').value.trim();
  const nick = document.getElementById('regNick').value.trim();
  const kd = document.getElementById('regKingdom').value.trim().replace('#','');
  const tc = document.getElementById('regTc').value;
  const pwr = parseInt(document.getElementById('regPower').value) || 0;
  if(!pid || !nick){ showToast(lang==='ko'?'ID와 닉네임을 입력하세요':'Enter ID & Nickname'); return; }

  const rec = { player_id: pid, nickname: nick, kingdom: kd, tc_level: tc, power: pwr, updated_at: new Date().toISOString() };
  playersDB = [rec, ...playersDB.filter(x=>String(x.player_id)!==pid)];
  localStorage.setItem('ks_players_cache', JSON.stringify(playersDB));
  setActiveProfile(rec, false);
  showToast(lang==='ko'?'Supabase DB 저장 완료!':'Saved to Supabase DB!');

  if(sb && /^\d+$/.test(pid)){
    try {
      await sb.from('players').upsert({
        fid: Number(pid),
        nickname: nick,
        kid: kd ? Number(kd) : null,
        stove_lv: labelToStove(tc),
        power_memo: String(pwr),
        updated_at: new Date().toISOString()
      }, { onConflict: 'fid' });
    } catch(e) {}
  }
  renderRoster();
}

async function deletePlayer(pid){
  playersDB = playersDB.filter(x=>String(x.player_id)!==String(pid));
  localStorage.setItem('ks_players_cache', JSON.stringify(playersDB));
  if(activePlayer && String(activePlayer.player_id)===String(pid)) setActiveProfile(playersDB[0]||null, false);
  if(sb && /^\d+$/.test(String(pid))){ try { await sb.from('players').delete().eq('fid', Number(pid)); } catch(e) {} }
  showToast(lang==='ko'?'삭제되었습니다':'Deleted');
  renderRoster();
}

async function runBatchRedeem(){
  const code = document.getElementById('batchCode').value.trim().toUpperCase();
  const log = document.getElementById('batchLog');
  if(!code){ showToast('코드를 입력하세요'); return; }
  if(!playersDB.length){ log.innerHTML = '등록된 플레이어 ID가 없습니다. 먼저 [왕국/검색]에서 ID를 등록해 주세요.'; return; }
  log.innerHTML = `<div>▶ [${code}] 일괄 발송 시작 (${playersDB.length}명)...</div>`;
  for(const p of playersDB){
    try {
      const res = await fetch('/.netlify/functions/ks-proxy', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'redeem', fid:p.player_id, cdk:code }) });
      if(res.ok){
        const d = await res.json();
        log.innerHTML += `<div class="text-emerald-400">✔ ${p.nickname} (${p.player_id}): ${d.msg||'전송 요청 완료'}</div>`;
      } else {
        log.innerHTML += `<div class="text-amber-300">△ ${p.nickname} (${p.player_id}): 수동 교환소 링크 이용 필요</div>`;
      }

      log.innerHTML += `<div class="text-amber-300">△ ${p.nickname} (${p.player_id}): 로컬 오프라인 모드 (코드 복사됨)</div>`;
    }
  }
  copyText(code);
}

function calcKvkRally(){
  const pts=document.getElementById('eHit').value.trim().split(':').map(Number);
  const out=document.getElementById('rOut'), k=lang==='ko';
  if(pts.length!==3||pts.some(isNaN)){out.innerHTML=`<div class="text-rose-400">HH:MM:SS</div>`;return;}
  const hit=pts[0]*3600+pts[1]*60+pts[2], prep=parseInt(document.getElementById('rPrep').value)||300;
  const fmt=s=>{s=((s%86400)+86400)%86400;return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>pad(n)).join(':');};
  out.innerHTML=[1,2,3].map(i=>{
    const m=parseInt(document.getElementById('m'+i).value)||0, imp=hit+i, op=imp-m-prep;
    return `<div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center"><div><b class="text-rose-400">B팀 ${i}집결 (+${i}s)</b><div class="text-[11px] text-slate-400">${k?'도착':'Hit'}: ${fmt(imp)}</div></div><div class="text-right"><div class="text-[10px] text-slate-400">${k?'개시(UTC)':'Open'}</div><b class="font-mono-code text-sm text-amber-400">${fmt(op)}</b></div></div>`;
  }).join('');
}

async function askAi(preset){
  const inp=document.getElementById('aiIn'), q=(preset||inp.value).trim(); if(!q)return; inp.value='';
  const log=document.getElementById('aiLog'), k=lang==='ko';
  log.innerHTML+=`<div class="flex justify-end"><div class="p-2 rounded-xl bg-sky-500 text-slate-950 font-bold">${q}</div></div>`;
  const key=localStorage.getItem('ks_gemini_key');
  if(key){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Kingshot game strategy expert, concise in ${k?'Korean':'English'}: ${q}`}]}]})});
      const d=await r.json(), rep=d?.candidates?.[0]?.content?.parts?.[0]?.text;
      if(rep){log.innerHTML+=`<div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 whitespace-pre-wrap">${rep}</div>`;log.scrollTop=log.scrollHeight;return;}
    }catch(e){}
  }
  const s=q.toLowerCase(); let ans=k?'베어, 비율, 순금, 장비 키워드로 질문해 주세요!':'Ask about Bear, Ratios, Truegold, or Gear!';
  if(s.includes('베어')||s.includes('bear')||s.includes('조이너')) ans=k?'🐻 참여자 1번 슬롯: 첸코, 연우, 아마데우스, 아마네, 마고, 비비안만 배치! 병종 비율 보10:기10:궁80':'🐻 Slot 1 Joiners: Chenko, Yeonwoo, Amadeus, Amane, Margot, Vivian. Ratio 10:10:80.';
  else if(s.includes('비율')||s.includes('집결')||s.includes('수성')) ans=k?'🧮 표준 집결: 50:20:30 / 수성 주둔: 60:20:20 / 베어 헌트: 10:10:80':'🧮 Standard PvP: 50:20:30 | Garrison: 60:20:20 | Bear: 10:10:80';
  else if(s.includes('순금')||s.includes('truegold')) ans=k?'🏗️ 8개 건물 Lv.1~8 총합: 순금 31,422개 + 순정금 908개 (16주 분산 정제 추천)':'🏗️ All 8 buildings Lv.1–8: 31,422 Truegold + 908 Tempered TG.';
  else if(s.includes('장비')||s.includes('gear')) ans=k?'🛡️ 장갑·부츠(공격/살상) 먼저 Lv.20→60→100, 갑옷류(방어) Lv.59·79 멈춤!':'🛡️ Gloves/Boots first (20→60→100); stop Armor at Lv.59/79.';
  log.innerHTML+=`<div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 whitespace-pre-wrap">${ans}</div>`;
  log.scrollTop=log.scrollHeight;
}
