function showToast(msg) {
  const b = document.getElementById('toastBox');
  b.textContent = msg;
  b.classList.remove('hidden');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => b.classList.add('hidden'), 2400);
}

function copyText(txt) {
  navigator.clipboard.writeText(String(txt));

}

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TABS[lang].map(([id, label]) => {

    return `<button type="button" onclick="switchTab('${id}')" class="px-3 py-1.5 rounded-xl whitespace-nowrap font-bold transition ${active ? 'bg-rose-600 text-white crimson-glow' : 'bg-zinc-900/90 text-zinc-300 hover:bg-zinc-800 border border-zinc-800'}">${label}</button>`;

}

function switchTab(id) {
  curTab = id;

}

/* ==================== TAB 0: HYBRID PUBLIC DB & LOOKUP QUEUE ==================== */
function formatStove(lv) {
  if (!lv && lv !== 0) return lang === 'ko' ? '등급 미정' : 'Unset';
  if (typeof lv === 'string') return lv;
  return lv <= 30 ? 'TC ' + lv : 'TG ' + (lv - 30);
}

function parseStoveNum(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toUpperCase();
  if (s.startsWith('TG')) return 30 + (parseInt(s.replace('TG', ''), 10) || 1);
  if (s.startsWith('TC')) return parseInt(s.replace('TC', ''), 10) || null;
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}

function timeAgo(iso) {
  if (!iso) return '-';
  const diff = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (diff < 60) return lang === 'ko' ? `${diff}분 전` : `${diff}m ago`;
  const hr = Math.floor(diff / 60);
  if (hr < 24) return lang === 'ko' ? `${hr}시간 전` : `${hr}h ago`;
  return lang === 'ko' ? `${Math.floor(hr / 24)}일 전` : `${Math.floor(hr / 24)}d ago`;
}

async function enqueuePlayerLookup(fid) {
  try {
    const { data } = await sb.from('lookup_queue').select('id').eq('fid', fid).eq('status', 'pending').limit(1);
    if (!data || data.length === 0) {
      await sb.from('lookup_queue').insert({ fid: fid, status: 'pending' });
    }
  } catch (e) {}
}

async function runHubSearch() {
  const raw = document.getElementById('hubSearchIn').value.trim();
  const area = document.getElementById('searchResultArea');
  const k = lang === 'ko';
  if (!raw) { area.innerHTML = ''; return; }

  area.innerHTML = `<div class="text-zinc-400 py-1">${k ? '공용 DB 조회 중...' : 'Searching Public DB...'}</div>`;

  // 1) #왕국 검색
  if (raw.startsWith('#')) {
    const kid = parseInt(raw.slice(1), 10);
    if (!kid) {
      area.innerHTML = `<div class="text-rose-400">${k ? '올바른 왕국 번호를 입력하세요. (예: #2107)' : 'Enter a valid Kingdom number (e.g. #2107)'}</div>`;
      return;
    }
    const [{ data: kList }, { data: pList }] = await Promise.all([
      sb.from('kingdoms').select('*').eq('kid', kid),
      sb.from('players').select('*').eq('kid', kid).order('stove_lv', { ascending: false, nullsFirst: false })
    ]);
    const info = kList && kList[0];
    area.innerHTML = `
      <div class="p-4 rounded-2xl bg-zinc-950 border border-purple-500/40 space-y-2.5">
        <div class="flex justify-between items-center">
          <b class="text-base text-purple-300">👑 Kingdom #${kid}</b>
          <span class="text-[11px] text-zinc-400">${info ? timeAgo(info.updated_at) : (k ? '전적 미등록' : 'No KvK log')}</span>
        </div>
        <div class="text-zinc-200">${info ? `${k ? '최근 전적' : 'Record'}: <b>${info.season_result || '-'}</b> · ${k ? '전송 그룹' : 'Transfer Group'}: <b>${info.transfer_group || '-'}</b>` : (k ? '우측 왕국 보드에서 이 서버의 전적을 등록할 수 있습니다.' : 'Log this kingdom record on the right panel.')}</div>
        <div class="text-[11px] text-rose-300 font-bold">${k ? `등록된 소속 플레이어 (${(pList || []).length}명)` : `Registered Players (${(pList || []).length})`}</div>
        <div class="space-y-1.5">${(pList || []).map(p => renderPlayerCard(p, false)).join('')}</div>
      </div>`;
    return;
  }

  // 2) 공용 DB 조회 (ID 또는 닉네임)
  const isNum = /^\d+$/.test(raw);
  let res;
  if (isNum) {
    res = await sb.from('players').select('*').or(`fid.eq.${raw},kid.eq.${raw}`);
  } else {
    res = await sb.from('players').select('*').ilike('nickname', `%${raw}%`).limit(15);
  }
  const list = res.data || [];

  if (list.length > 0) {
    area.innerHTML = list.map(p => renderPlayerCard(p, true)).join('');
    // 숫자 ID 조회 시 홈 워커가 켜져 있으면 백그라운드에서 최신 TG 등급 자동 갱신 큐 등록
    if (isNum) enqueuePlayerLookup(Number(raw));
    return;
  }

  // 3) 미등록 숫자 ID -> lookup_queue 자동 대기열 등록 + 즉시 수동 등록/교환소 확인 카드 동시 제공
  if (isNum) {
    const fid = Number(raw);
    enqueuePlayerLookup(fid);
    area.innerHTML = `
      <div class="p-4 rounded-2xl bg-zinc-950 border border-amber-500/40 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <b class="text-amber-300">⏳ ${k ? `ID ${fid} — 자동 조회 대기열 등록됨` : `ID ${fid} — Queued for Auto-Lookup`}</b>
          <span id="queuePulse_${fid}" class="px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 font-mono-code text-[11px]">${k ? '워커 응답 대기 중 (6초)...' : 'Waiting for worker (6s)...'}</span>
        </div>
        <p class="text-[11px] text-zinc-300">
          ${k ? '홈 서버 워커가 켜져 있으면 2~3초 내 자동으로 닉네임·TG 등급이 채워집니다. 지금 바로 아래에서 직접 입력해 저장할 수도 있습니다.' : 'If the home worker is online, player info will appear in 2-3s. Or register manually below:'}
        </p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input id="qNick_${fid}" placeholder="${k ? '인게임 닉네임' : 'Nickname'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-white"/>
          <input id="qKid_${fid}" type="number" placeholder="${k ? '왕국# (예: 2107)' : 'Kingdom#'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 font-mono-code text-white"/>
          <input id="qLv_${fid}" placeholder="${k ? '등급 (예: TC30, TG2)' : 'Level (TC30, TG2)'}" class="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 font-mono-code text-white"/>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <a href="https://ks-giftcode.centurygame.com/" target="_blank" rel="noopener" class="text-[11px] text-zinc-400 hover:text-rose-300 underline">${k ? '공식 교환소에서 닉네임·등급 확인 ↗' : 'Check nickname/level on Official Site ↗'}</a>
          <button type="button" onclick="quickSavePlayer(${fid})" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">${k ? '공용 DB에 즉시 저장' : 'Save to Public DB'}</button>
        </div>
      </div>`;

    let tries = 0;
    const timer = setInterval(async () => {
      tries++;
      const { data: found } = await sb.from('players').select('*').eq('fid', fid);
      if (found && found.length > 0) {
        clearInterval(timer);
        area.innerHTML = found.map(p => renderPlayerCard(p, true)).join('');
        loadLiveLists();
      } else if (tries >= 3) {
        clearInterval(timer);
        const badge = document.getElementById('queuePulse_' + fid);
        if (badge) badge.textContent = k ? '대기열 저장됨 (수동 입력 가능)' : 'Queued (Manual entry ready)';
      }
    }, 2000);
    return;
  }

  area.innerHTML = `<div class="p-3.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-300">${k ? `'${raw}' 검색 결과가 없습니다. 숫자 플레이어 ID를 입력하면 자동 대기열 등록 및 신규 등록이 가능합니다.` : `No results for '${raw}'. Search by numeric Player ID to register.`}</div>`;
}

  const lvTxt = formatStove(p.stove_lv);

        <div class="flex items-center gap-3">
          <div class="px-2.5 py-1.5 rounded-xl bg-rose-500/20 border border-rose-500/40 font-mono-code font-bold text-rose-300">${lvTxt}</div>
          <div>
            <div class="font-bold text-sm text-white">${safeNick} <span class="text-xs font-mono-code text-zinc-400">(ID: ${p.fid})</span></div>
            <div class="text-[11px] text-zinc-400">Kingdom #${p.kid || '?'} · <span class="text-emerald-400">${timeAgo(p.updated_at)}</span></div>
          </div>
        </div>

async function quickSavePlayer(fid) {
  const nickname = (document.getElementById('qNick_' + fid)?.value || '').trim() || ('Governor_' + fid);
  const kid = parseInt(document.getElementById('qKid_' + fid)?.value, 10) || null;
  const stove_lv = parseStoveNum(document.getElementById('qLv_' + fid)?.value);
  const { error } = await sb.from('players').upsert({
    fid, nickname, kid, stove_lv, updated_at: new Date().toISOString()
  }, { onConflict: 'fid' });
  if (error) {
    showToast('Error: ' + error.message);
    return;

  showToast(lang === 'ko' ? '공용 DB 저장 완료!' : 'Saved to Public DB!');

async function registerKingdomDb() {

async function loadLiveLists() {
  const k = lang === 'ko';

  const [{ data: players, count }, { data: kingdoms }] = await Promise.all([
    sb.from('players').select('*', { count: 'exact' }).order('updated_at', { ascending: false }).limit(15),
    sb.from('kingdoms').select('*').order('updated_at', { ascending: false }).limit(10)
  ]);

      <span class="text-[10px] text-emerald-400 font-mono-code">${timeAgo(p.updated_at)}</span>
    </div>`).join('') : `<div class="p-3 rounded-xl bg-zinc-950 text-zinc-400">${k ? '아직 등록된 플레이어가 없습니다. 위 검색창에 숫자 ID를 입력해 첫 등록해 보세요!' : 'No tracked players yet.'}</div>`;

  kBox.innerHTML = (kingdoms && kingdoms.length) ? kingdoms.map(x => `

    </div>`).join('') : `<div class="p-3 rounded-xl bg-zinc-950 text-zinc-400">${k ? '등록된 왕국 기록이 없습니다.' : 'No kingdom records yet.'}</div>`;

function calcRally() {
  const cap = parseInt(document.getElementById('simCap').value, 10) || 100000;
  const mCnt = parseInt(document.getElementById('simMarches').value, 10) || 3;
  const [ri, rc, ra] = { pvp: [50, 20, 30], gar: [60, 20, 20], bear: [10, 10, 80], spear: [40, 40, 20] }[rallyPreset];
  const inf = Math.round(cap * ri / 100), cav = Math.round(cap * rc / 100), arch = cap - inf - cav;
  const k = lang === 'ko';
  const copyStr = `[Kingshot Troop ${ri}:${rc}:${ra}] 1 March (${cap.toLocaleString()}): Inf ${inf.toLocaleString()} / Cav ${cav.toLocaleString()} / Arch ${arch.toLocaleString()}`;
  document.getElementById('simOut').innerHTML = `
    <div class="grid grid-cols-3 gap-2.5 text-center">
      <div class="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
        <div class="text-zinc-300 font-bold">${k ? '🛡️ 보병' : '🛡️ Infantry'} (${ri}%)</div>
        <div class="font-mono-code font-black text-base text-white mt-0.5">${inf.toLocaleString()}</div>
        <div class="text-[10px] text-zinc-400">${mCnt}부대: ${(inf * mCnt).toLocaleString()}</div>
      </div>
      <div class="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
        <div class="text-zinc-300 font-bold">${k ? '🐎 기병' : '🐎 Cavalry'} (${rc}%)</div>
        <div class="font-mono-code font-black text-base text-white mt-0.5">${cav.toLocaleString()}</div>
        <div class="text-[10px] text-zinc-400">${mCnt}부대: ${(cav * mCnt).toLocaleString()}</div>
      </div>
      <div class="p-3 rounded-xl bg-zinc-950 border border-rose-500/50">
        <div class="text-rose-400 font-bold">${k ? '🏹 궁병' : '🏹 Archers'} (${ra}%)</div>
        <div class="font-mono-code font-black text-base text-rose-300 mt-0.5">${arch.toLocaleString()}</div>
        <div class="text-[10px] text-zinc-400">${mCnt}부대: ${(arch * mCnt).toLocaleString()}</div>
      </div>
    </div>
    <button type="button" onclick="copyText('${copyStr}')" class="w-full py-2.5 rounded-xl bg-rose-600 text-white font-bold">${k ? '📋 연맹 채팅용 편성표 복사' : '📋 Copy Troop Ratio'}</button>`;
}

    ? `왕복 주기 ${cycle}초 → 30분간 최대 ${runs}회 연속 탑승 가능`
    : `Cycle ${cycle}s → Max ${runs} rallies in 30m`;
}

  else if (s.includes('순금') || s.includes('truegold')) ans = k ? '🏗️ 8개 건물 Lv.1~8 총합: 순금 31,422개 + 순정금 908개' : '🏗️ All 8 buildings Lv.1–8: 31,422 Truegold + 908 Tempered TG.';
  else if (s.includes('장비') || s.includes('gear')) ans = k ? '🛡️ 공격/살상력(장갑·부츠) Lv.20→60→100 먼저 강화, 방어 갑옷류는 Lv.59·79 멈춤!' : '🛡️ Upgrade Gloves/Boots to 20→60→100 first; stop Armor at Lv.59/79.';
  else if (s.includes('시설') || s.includes('facility')) ans = k ? '🏰 연맹 깃발 75% 이상 덮어야 공격 가능, 15분 연속 점령 시 확정!' : '🏰 Requires >=75% banner coverage & 15m continuous hold.';
  log.innerHTML += `<div class="p-2 rounded-xl bg-zinc-950 border border-zinc-800 whitespace-pre-wrap">${ans}</div>`;
  log.scrollTop = log.scrollHeight;
}

function renderTab() {
  ({ search: renderSearch, rally: renderRally, bear: renderBear, kvk: renderKvk, sw: renderSw, tri: renderTri, fac: renderFac, tg: renderTg, hero: renderHero, shop: renderShop, mys: renderMys, mac: renderMac, notes: renderNotes, ai: renderAi })[curTab]();
}

setLang(lang);
</script>
